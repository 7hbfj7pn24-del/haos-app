  <script>
/* ХАОС v1.0.0. No accounts, analytics, tracking, or external libraries. */
(()=>{
'use strict';
const STORAGE_KEY='chaos-personal-v1';
const VAULT_KEY='haos-encrypted-vault-v2';
const KDF_ITERATIONS=310000;
const blank=()=>({version:1,tasks:[],entries:[],projects:[]});
let data=blank();
let activeKey=null, vaultSalt=null, persistQueue=Promise.resolve(), vaultBusy=false;
let view='today',entryFilter='all',taskFilter='active',activeProjectId=null,query='',toastTimer;
const $=sel=>document.querySelector(sel);
const main=$('#app'),modal=$('#modalRoot');
const moods=[['😌','Спокойно'],['🙂','Нормально'],['🥹','Трогательно'],['😤','Бесит'],['🫠','Хаос'],['💜','Хорошо']];
const typeNames={journal:'Дневник',note:'Заметка',idea:'Идея'};
const typeIcons={journal:'☾',note:'▤',idea:'✦'};
const formatToday=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const readableDate=val=>{if(!val)return '';const d=new Date((/^\d{4}-\d{2}-\d{2}$/.test(val)?val+'T12:00:00':val));return Number.isFinite(d.getTime())?new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',year:'numeric'}).format(d):''};
const readableWeekday=()=>new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shorten=(s,n=135)=>{s=String(s||'').trim();return s.length>n?s.slice(0,n).trim()+'…':s};
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const time=()=>new Date().toISOString();
function load(){try{const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY));if(parsed&&Array.isArray(parsed.tasks)&&Array.isArray(parsed.entries)&&Array.isArray(parsed.projects)){return {version:1,tasks:parsed.tasks,entries:parsed.entries,projects:parsed.projects}}}catch(e){console.warn('Unable to load local storage',e)}return blank()}

function toBase64(bytes){let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s)}
function fromBase64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function validateData(raw){if(!raw||!Array.isArray(raw.tasks)||!Array.isArray(raw.entries)||!Array.isArray(raw.projects))throw new Error('Повреждённые данные');return {version:1,tasks:raw.tasks,entries:raw.entries,projects:raw.projects}}
async function deriveKey(pass,salt,iterations=KDF_ITERATIONS){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptState(key,state,salt){const iv=crypto.getRandomValues(new Uint8Array(12));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(state)));return {version:2,kdf:'PBKDF2-SHA256',iterations:KDF_ITERATIONS,salt:toBase64(salt),iv:toBase64(iv),ciphertext:toBase64(new Uint8Array(cipher))}}
async function decryptState(vault,pass){if(vault.version!==2||vault.kdf!=='PBKDF2-SHA256'||vault.iterations<100000||vault.iterations>2000000)throw new Error('Неизвестный формат сейфа');const salt=fromBase64(vault.salt);const key=await deriveKey(pass,salt,vault.iterations);const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromBase64(vault.iv)},key,fromBase64(vault.ciphertext));return {key,salt,data:validateData(JSON.parse(new TextDecoder().decode(plaintext)))}}
function getVault(){try{const raw=localStorage.getItem(VAULT_KEY);return raw?JSON.parse(raw):null}catch(e){return {corrupted:true}}}
function save(){if(!activeKey||!vaultSalt)return Promise.reject(new Error('Сейф закрыт'));const snapshot=JSON.parse(JSON.stringify(data));const key=activeKey,salt=vaultSalt;persistQueue=persistQueue.catch(()=>{}).then(async()=>{const encrypted=await encryptState(key,snapshot,salt);localStorage.setItem(VAULT_KEY,JSON.stringify(encrypted));return true}).catch(err=>{console.error('Save failed',err);notify('Не удалось сохранить! Сделай копию и проверь память телефона.');throw err});return persistQueue}
function setAuthMode(mode){const create=mode==='create';$('#authTitle').textContent=create?'Создай свой пароль':'С возвращением в ХАОС';$('#authCopy').textContent=create?'Задай длинный личный пароль. Все записи будут зашифрованы на этом устройстве.':'Доступ к дневнику только после расшифровки записей.';$('#authRepeatLabel').classList.toggle('hidden',!create);$('#authRepeat').required=create;$('#authSubmit').textContent=create?'Создать защищённый ХАОС':'Разблокировать';$('#authPassword').setAttribute('minlength',create?'12':'1');$('#authPassword').value='';$('#authRepeat').value='';$('#authError').textContent='';document.body.classList.add('is-locked');$('#authScreen').classList.remove('hidden');}
async function initializeVault(){if(!globalThis.crypto?.subtle){setAuthMode('unlock');$('#authCopy').textContent='В этом браузере недоступно шифрование. Открой ХАОС по HTTPS в Safari.';$('#authSubmit').disabled=true;return;}const vault=getVault();setAuthMode(vault?'unlock':'create');if(vault?.corrupted)$('#authError').textContent='Хранилище повреждено. Не удаляй данные. Сделай копию перед восстановлением.'}
async function unlockWithPass(pass){const vault=getVault();if(vault){const opened=await decryptState(vault,pass);activeKey=opened.key;vaultSalt=opened.salt;data=opened.data;}else{vaultSalt=crypto.getRandomValues(new Uint8Array(16));activeKey=await deriveKey(pass,vaultSalt);data=load();await save();localStorage.removeItem(STORAGE_KEY);}view='today';query='';$('#globalSearch').value='';$('#searchPanel').classList.add('hidden');$('#authScreen').classList.add('hidden');document.body.classList.remove('is-locked');render();}
async function lockVault(){if(document.body.classList.contains('is-locked')||vaultBusy)return;vaultBusy=true;try{await persistQueue}catch(e){};activeKey=null;vaultSalt=null;data=blank();main.innerHTML='';modal.innerHTML='';setAuthMode('unlock');vaultBusy=false;}
$('#authForm').addEventListener('submit',async event=>{event.preventDefault();if(vaultBusy)return;const pass=$('#authPassword').value;const isCreate=!getVault();$('#authError').textContent='';if(isCreate&&(pass.length<12||pass!==$('#authRepeat').value)){ $('#authError').textContent=pass.length<12?'Нужно хотя бы 12 символов. Лучше длинную фразу.':'Пароли не совпадают.';return;}vaultBusy=true;$('#authSubmit').disabled=true;try{await unlockWithPass(pass);}catch(e){activeKey=null;vaultSalt=null;data=blank();$('#authError').textContent=getVault()?.corrupted?'Повреждены данные сейфа.':'Не получилось открыть: неверный пароль или повреждённая копия.';console.warn('Unable to unlock local vault',e)}finally{vaultBusy=false;$('#authSubmit').disabled=false;$('#authPassword').value='';$('#authRepeat').value=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)lockVault()});

function notify(msg){const el=$('#toast');el.textContent=msg;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),2900)}
function projectName(id){const p=data.projects.find(x=>x.id===id);return p?p.title:''}
function projectOptions(selected){return `<option value="">Без проекта</option>`+data.projects.map(p=>`<option value="${escape(p.id)}" ${p.id===selected?'selected':''}>${escape(p.title)}</option>`).join('')}
function countProject(id){return data.tasks.filter(x=>x.projectId===id).length+data.entries.filter(x=>x.projectId===id).length}
function sortedEntries(entries){return [...entries].sort((a,b)=>(b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||''))}
function sortedTasks(tasks){return [...tasks].sort((a,b)=>Number(a.done)-Number(b.done)||(a.due||'9999').localeCompare(b.due||'9999')||(b.createdAt||'').localeCompare(a.createdAt||''))}
function stats(){const today=formatToday();return {todayTasks:data.tasks.filter(t=>!t.done&&t.due&&t.due<=today).length,active:data.tasks.filter(t=>!t.done).length,ideas:data.entries.filter(e=>e.type==='idea').length,entries:data.entries.length}}
function empty(icon,title,desc,action,label){return `<div class="empty"><div class="empty-symbol">${icon}</div><div class="empty-title">${escape(title)}</div><p>${escape(desc)}</p>${action?`<button class="ghost-button" data-action="${action}">${escape(label||'Добавить +')}</button>`:''}</div>`}
function projectBadge(id){return id&&projectName(id)?`<span class="pill">◈ ${escape(projectName(id))}</span>`:''}
function dueBadge(t){if(!t.due)return '';const today=formatToday();const cls=!t.done&&t.due<today?'pink':t.due===today?'amber':'';return `<span class="pill ${cls}">${t.due<today&&!t.done?'Просрочено · ':''}${escape(readableDate(t.due))}</span>`}
function taskCard(t){return `<div class="card"><div class="task-row"><button class="task-checkbox ${t.done?'checked':''}" data-action="toggle-task" data-id="${escape(t.id)}" aria-label="${t.done?'Вернуть задачу':'Отметить выполненной'}">${t.done?'✓':''}</button><div class="task-text ${t.done?'done':''}" data-action="edit-task" data-id="${escape(t.id)}" role="button" tabindex="0"><h3 class="card-title">${escape(t.title)}</h3>${t.detail?`<div class="task-details">${escape(shorten(t.detail,100))}</div>`:''}<div class="inline-row" style="margin-top:10px">${dueBadge(t)}${projectBadge(t.projectId)}${t.priority==='high'?'<span class="pill pink">Важное</span>':''}</div></div><button class="icon-button" style="width:31px;height:31px;border-radius:10px" data-action="edit-task" data-id="${escape(t.id)}" aria-label="Изменить задачу"><span style="font-size:18px">⋯</span></button></div></div>`}
function entryCard(e){const mood=e.mood?`<span class="pill pink">${escape(e.mood)}</span>`:'';return `<article class="card card-clickable" data-action="edit-entry" data-id="${escape(e.id)}" role="button" tabindex="0"><div class="card-head"><h3 class="card-title"><span class="entry-mark" aria-hidden="true">${typeIcons[e.type]||'▤'}</span>${escape(e.title||(e.type==='journal'?'Мой день':'Без названия'))}</h3><span class="pill">${escape(typeNames[e.type]||'Запись')}</span></div>${e.body?`<p class="card-body">${escape(shorten(e.body,180))}</p>`:''}<div class="inline-row" style="margin-top:11px">${mood}${projectBadge(e.projectId)}</div><div class="meta">${escape(readableDate(e.createdAt))}</div></article>`}
function pageHead(tag,title,subtitle){return `<p class="eyebrow">${escape(tag)}</p><h1 class="page-title">${escape(title)}</h1><p class="page-subtitle">${escape(subtitle)}</p>`}
function renderToday(){const s=stats(),today=formatToday(),dueTasks=sortedTasks(data.tasks.filter(t=>!t.done&&t.due&&t.due<=today)).slice(0,5),recent=sortedEntries(data.entries).slice(0,2);return `<div class="hero"><p class="eyebrow">ТВОЁ ПРОСТРАНСТВО</p><h1>Держим хаос<br>под контролем.</h1><p>Можно всё записать. Ничего не обязано быть идеальным.</p><button class="primary-button" data-action="add-idea">✦ Поймать мысль</button></div><div class="heading-inline"><h2 class="page-title" style="font-size:25px">Сегодня</h2><span class="count-info">${escape(readableWeekday())}</span></div><div class="section-gap"></div><div class="stat-grid"><div class="stat"><div class="stat-number purple">${s.todayTasks}</div><div class="stat-caption">на сегодня</div></div><div class="stat"><div class="stat-number pink">${s.ideas}</div><div class="stat-caption">идей</div></div><div class="stat"><div class="stat-number green">${s.entries}</div><div class="stat-caption">записей</div></div></div><div class="section-header"><h2>📌 Важное на сегодня</h2><button class="ghost-button" data-nav="tasks">Весь план ›</button></div>${dueTasks.length?dueTasks.map(taskCard).join(''):empty('☑','Задач на сегодня нет','Можно выдохнуть или придумать себе приключений.','add-task','Добавить задачу +')}<div class="section-header"><h2>✧ Недавние записи</h2><button class="ghost-button" data-nav="entries">Все записи ›</button></div>${recent.length?recent.map(entryCard).join(''):empty('✦','Чистый лист','Мысли, настроение, планы. Всё сюда.','add-entry','Создать запись +')}<p class="footer-note">Без оценок продуктивности. Это твой инструмент, а не надзиратель.</p>`}
function renderTasks(){let list=sortedTasks(data.tasks);const today=formatToday();if(taskFilter==='active')list=list.filter(t=>!t.done);if(taskFilter==='today')list=list.filter(t=>!t.done&&t.due&&t.due<=today);if(taskFilter==='future')list=list.filter(t=>!t.done&&t.due>today);if(taskFilter==='done')list=list.filter(t=>t.done);return `${pageHead('ПЛАНЕР','Что по плану?','Планы меняются. Записи остаются.') }<div class="top-line"><span class="count-info">Незавершённых: ${data.tasks.filter(t=>!t.done).length}</span><button class="soft-button" data-action="add-task">+ Задача</button></div><div class="chip-row">${[['active','Актуальные'],['today','Сегодня'],['future','Позже'],['done','Готово'],['all','Все']].map(([id,label])=>`<button class="chip ${taskFilter===id?'active':''}" data-action="task-filter" data-filter="${id}">${label}</button>`).join('')}</div>${list.length?list.map(taskCard).join(''):empty('☑','Здесь пока пусто','Сделай первую задачу. Или не делай, это тоже вариант.','add-task','Добавить задачу +')}`}
function renderEntries(){const filtered=sortedEntries(data.entries.filter(e=>entryFilter==='all'||e.type===entryFilter));return `${pageHead('ЗАПИСИ','Из головы на экран.','Дневник, заметки и мысли, которые нужно поймать за хвост.')}<div class="top-line"><span class="count-info">Всего записей: ${data.entries.length}</span><button class="soft-button" data-action="add-entry">+ Запись</button></div><div class="chip-row">${[['all','Все'],['journal','☾ Дневник'],['note','▤ Заметки'],['idea','✦ Идеи']].map(([id,label])=>`<button class="chip ${entryFilter===id?'active':''}" data-action="entry-filter" data-filter="${id}">${label}</button>`).join('')}</div>${filtered.length?filtered.map(entryCard).join(''):empty('▤','Тут ещё тихо','Открой дневник или сохрани первую внезапную мысль.','add-entry','Создать запись +')}`}
function projectCard(p){return `<div class="card card-clickable" data-action="open-project" data-id="${escape(p.id)}" role="button" tabindex="0"><div class="card-head"><h3 class="card-title"><span class="entry-mark">◈</span>${escape(p.title)}</h3><span class="pill">${countProject(p.id)} элементов</span></div>${p.description?`<p class="card-body">${escape(shorten(p.description,140))}</p>`:''}<div class="meta">Нажми, чтобы открыть ›</div></div>`}
function renderMore(){return `${pageHead('ВСЁ ОСТАЛЬНОЕ','Уголок управления.','Проекты, резервные копии и немного полезной паранойи.')}<button class="more-item" data-action="projects"><span class="more-icon">◈</span><span class="more-info"><strong>Мои проекты</strong><small>${data.projects.length} проектов · всё разложено по полочкам</small></span><span class="chevron">›</span></button><button class="more-item" data-action="settings"><span class="more-icon">⚙</span><span class="more-info"><strong>Настройки и данные</strong><small>Резервная копия, восстановление, безопасность</small></span><span class="chevron">›</span></button><div class="info-box">🔐 <strong>Приватность без цирка:</strong> нет регистрации и передачи записей. Данные зашифрованы на этом устройстве. Чтобы не потерять записи, регулярно экспортируй резервную копию.</div>`}
function renderProjects(){return `<div class="top-line"><div>${pageHead('ПАПКИ ДЛЯ ЖИЗНИ','Проекты','Разные вселенные. Одна голова.')}</div></div><div class="section-header" style="margin-top:0"><span class="count-info">Всего проектов: ${data.projects.length}</span><button class="soft-button" data-action="add-project">+ Проект</button></div>${data.projects.length?data.projects.map(projectCard).join(''):empty('◈','Проектов пока нет','Можно завести папки для работы, творчества и любых безумных затей.','add-project','Создать проект +')}<button class="ghost-button" data-action="more">‹ Назад</button>`}
function renderProject(){const p=data.projects.find(x=>x.id===activeProjectId);if(!p){view='projects';return renderProjects()}const tasks=sortedTasks(data.tasks.filter(x=>x.projectId===p.id)),entries=sortedEntries(data.entries.filter(x=>x.projectId===p.id));return `<button class="ghost-button" data-action="projects">‹ Все проекты</button>${pageHead('ПРОЕКТ','◈ '+p.title,p.description||'Здесь всё, что относится к этому проекту.')}<div class="top-line"><span class="count-info">${tasks.length} задач · ${entries.length} записей</span><button class="soft-button" data-action="edit-project" data-id="${escape(p.id)}">Изменить</button></div><div class="section-header"><h2>Задачи</h2><button class="ghost-button" data-action="add-project-task" data-id="${escape(p.id)}">+ Добавить</button></div>${tasks.length?tasks.map(taskCard).join(''):empty('☑','Задач пока нет','Начни с одного маленького шага.','add-task','Добавить задачу +')}<div class="section-header"><h2>Записи</h2><button class="ghost-button" data-action="add-project-note" data-id="${escape(p.id)}">+ Добавить</button></div>${entries.length?entries.map(entryCard).join(''):empty('▤','Записей пока нет','Здесь появятся мысли и материалы по проекту.','add-entry','Создать запись +')}`}
function renderSettings(){return `<button class="ghost-button" data-action="more">‹ Назад</button>${pageHead('НАСТРОЙКИ','Твои данные.','Личный шифрованный сейф без подписки.')}<div class="section-header"><h2>Резервные копии</h2></div><div class="card"><h3 class="card-title">Сохранить всё в файл</h3><p class="card-body">Скачает зашифрованный JSON-файл. Для восстановления понадобится пароль от сейфа.</p><div style="height:12px"></div><button class="primary-button" data-action="export">↓ Сделать копию</button></div><div class="card"><h3 class="card-title">Восстановить из файла</h3><p class="card-body">Заменит текущие записи содержимым выбранной резервной копии. Сначала сохрани текущие данные.</p><div style="height:12px"></div><button class="soft-button" data-action="import">↑ Загрузить копию</button></div><div class="card"><h3 class="card-title">🔒 Заблокировать сейчас</h3><p class="card-body">После сворачивания ХАОС блокируется сам.</p><div style="height:12px"></div><button class="soft-button" data-action="lock-vault">Закрыть сейф</button></div><div class="section-header"><h2>Важно знать</h2></div><div class="info-box">Зашифрованные данные живут <strong>в браузере этого устройства</strong>. Если удалить данные сайта, переустановить приложение или потерять телефон без резервной копии, записи могут исчезнуть. Синхронизации между устройствами пока нет.<br><br>Напоминания и прикрепление фотографий пока не добавлены. Это первая рабочая версия.</div><div class="card"><h3 class="card-title">Очистить всё</h3><p class="card-body">Полное удаление задач и записей на этом устройстве.</p><div style="height:12px"></div><button class="danger-button" data-action="clear-all">Удалить все данные</button></div><p class="footer-note">ХАОС · 1.0 · сделано без подписок ♥</p>`}
function renderSearch(){const q=query.toLocaleLowerCase('ru-RU').trim();const match=s=>String(s||'').toLocaleLowerCase('ru-RU').includes(q);const tasks=sortedTasks(data.tasks.filter(x=>match(x.title)||match(x.detail)||match(projectName(x.projectId))));const entries=sortedEntries(data.entries.filter(x=>match(x.title)||match(x.body)||match(projectName(x.projectId))));const projects=data.projects.filter(x=>match(x.title)||match(x.description));return `${pageHead('ПОИСК','Нашлось вот что.','Поиск по задачам, дневнику, заметкам, идеям и проектам.')}<div class="section-header"><h2>Результаты</h2><span class="count-info">${tasks.length+entries.length+projects.length}</span></div>${tasks.map(taskCard).join('')}${entries.map(entryCard).join('')}${projects.map(projectCard).join('')}${!(tasks.length+entries.length+projects.length)?empty('⌕','Совпадений нет','Попробуй другое слово.'):''}`}
function render(){document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===view||((view==='projects'||view==='project'||view==='settings')&&el.dataset.nav==='more')));main.innerHTML=query.trim()?renderSearch():({today:renderToday,tasks:renderTasks,entries:renderEntries,more:renderMore,projects:renderProjects,project:renderProject,settings:renderSettings}[view]||renderToday)()}
function go(target){view=target;query='';$('#globalSearch').value='';$('#searchPanel').classList.add('hidden');window.scrollTo({top:0,behavior:'instant'});render()}
function modalBase(title,body){modal.innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="sheet-handle"></div><div class="sheet-top"><h2 class="sheet-title" id="modalTitle">${escape(title)}</h2><button class="close-button" data-action="close-modal" aria-label="Закрыть">×</button></div>${body}</div></div>`;const first=modal.querySelector('input,textarea,[data-action="choose"]');if(first)setTimeout(()=>first.focus({preventScroll:true}),60)}
function closeModal(){modal.innerHTML=''}
function chooseType(){modalBase('Что сохраняем?',`<div class="choose-grid"><button class="choose-card" data-action="choose" data-type="idea"><span class="choose-icon">✦</span><strong>Идея</strong><small>Внезапно пришло в голову</small></button><button class="choose-card" data-action="choose" data-type="task"><span class="choose-icon">☑</span><strong>Задача</strong><small>Надо сделать. Наверное</small></button><button class="choose-card" data-action="choose" data-type="journal"><span class="choose-icon">☾</span><strong>Дневник</strong><small>Как прошёл день</small></button><button class="choose-card" data-action="choose" data-type="note"><span class="choose-icon">▤</span><strong>Заметка</strong><small>Чтобы не забыть</small></button><button class="choose-card" data-action="choose" data-type="project"><span class="choose-icon">◈</span><strong>Проект</strong><small>Собрать всё в одной папке</small></button></div>`)}
function formField(name,label,value,placeholder='',required=false){return `<label class="field"><span class="field-label">${escape(label)}</span><input name="${name}" value="${escape(value||'')}" placeholder="${escape(placeholder)}" ${required?'required':''} maxlength="180"></label>`}
function textareaField(name,label,value,placeholder){return `<label class="field"><span class="field-label">${escape(label)}</span><textarea name="${name}" placeholder="${escape(placeholder)}" maxlength="20000">${escape(value||'')}</textarea></label>`}
function projectSelect(selected){return `<label class="field"><span class="field-label">Проект (необязательно)</span><select name="projectId">${projectOptions(selected)}</select></label>`}
function openForm(kind,id=null,preselectedProject=null){const collection=kind==='task'?'tasks':kind==='project'?'projects':'entries';const existing=id?data[collection].find(x=>x.id===id):null;const isEdit=!!existing;let fields='';const title=isEdit?'Изменить '+(kind==='task'?'задачу':kind==='project'?'проект':'запись'):({task:'Новая задача',journal:'Мой дневник',note:'Новая заметка',idea:'Новая идея',project:'Новый проект'}[kind]);
if(kind==='task')fields=formField('title','Что сделать?',existing?.title,'Например: разобраться с планами',true)+textareaField('detail','Подробности',existing?.detail,'Любые детали, ссылки, мысли…')+`<div class="field-grid"><label class="field"><span class="field-label">Когда</span><input type="date" name="due" value="${escape(existing?.due||'')}"></label><label class="field"><span class="field-label">Важность</span><select name="priority"><option value="normal" ${existing?.priority!=='high'?'selected':''}>Обычная</option><option value="high" ${existing?.priority==='high'?'selected':''}>Важная</option></select></label></div>`+projectSelect(existing?.projectId??preselectedProject);
else if(kind==='project')fields=formField('title','Название проекта',existing?.title,'Например: мои планы',true)+textareaField('description','Описание',existing?.description,'Что здесь будет жить?');
else fields=formField('title',kind==='journal'?'Название (необязательно)':'Название',existing?.title,kind==='journal'?'Например: странный день':'Дай мысли название',kind!=='journal')+textareaField('body',kind==='journal'?'Что сегодня произошло?':'Текст',existing?.body,kind==='journal'?'Рассказывай. Здесь можно быть собой.':'Пиши всё, что хочется…')+(kind==='journal'?`<label class="field"><span class="field-label">Настроение (необязательно)</span><select name="mood"><option value="">Не выбрано</option>${moods.map(([emoji,label])=>`<option value="${emoji+' '+label}" ${existing?.mood===emoji+' '+label?'selected':''}>${emoji} ${label}</option>`).join('')}</select></label>`:'')+projectSelect(existing?.projectId??preselectedProject);
modalBase(title,`<form id="recordForm" data-kind="${kind}" data-id="${escape(id||'')}">${fields}<div class="form-actions">${isEdit?`<button type="button" class="danger-button" data-action="delete" data-kind="${kind}" data-id="${escape(id)}">Удалить</button>`:'<span></span>'}<button class="primary-button" type="submit">${isEdit?'Сохранить изменения':'Сохранить'}</button></div></form>`);
}
function submitForm(event){event.preventDefault();const form=event.target;const kind=form.dataset.kind;const id=form.dataset.id;const fields=Object.fromEntries(new FormData(form));const title=String(fields.title||'').trim();const body=String(fields.body||'').trim();if((kind!=='journal'&&!title)||(kind==='journal'&&!title&&!body)){notify('Напиши хоть что-нибудь ✎');return}const collection=kind==='task'?'tasks':kind==='project'?'projects':'entries';const existing=data[collection].find(x=>x.id===id);const timestamp=time();let record;
if(kind==='task')record={id:existing?.id||uid(),title,detail:String(fields.detail||'').trim(),due:fields.due||'',priority:fields.priority==='high'?'high':'normal',projectId:fields.projectId||'',done:existing?.done||false,createdAt:existing?.createdAt||timestamp,updatedAt:timestamp};
else if(kind==='project')record={id:existing?.id||uid(),title,description:String(fields.description||'').trim(),createdAt:existing?.createdAt||timestamp,updatedAt:timestamp};
else record={id:existing?.id||uid(),type:kind,title:title||(kind==='journal'?'Запись за '+readableDate(formatToday()):'Без названия'),body,mood:kind==='journal'?fields.mood||'':'',projectId:fields.projectId||'',createdAt:existing?.createdAt||timestamp,updatedAt:timestamp};
if(existing){data[collection]=data[collection].map(x=>x.id===id?record:x)}else{data[collection].push(record)}save();closeModal();render();notify(existing?'Изменения сохранены ♥':'Сохранено ♥')}
function toggleTask(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;t.updatedAt=time();save();render();notify(t.done?'Готово ✓':'Задача снова в списке')}
function removeRecord(kind,id){const collection=kind==='task'?'tasks':kind==='project'?'projects':'entries';if(!confirm(kind==='project'?'Удалить проект? Задачи и записи останутся, но без привязки к нему.':'Удалить эту запись без возможности отмены?'))return;data[collection]=data[collection].filter(x=>x.id!==id);if(kind==='project'){for(const x of [...data.tasks,...data.entries]){if(x.projectId===id)x.projectId=''}if(activeProjectId===id)view='projects'}save();closeModal();render();notify('Удалено')}

async function downloadBackup(){try{await persistQueue;const vault=JSON.parse(localStorage.getItem(VAULT_KEY));if(!vault)throw new Error('Сейф ещё не сохранён');const payload=JSON.stringify({format:'haos-encrypted-backup-v2',exportedAt:time(),vault},null,2);const blob=new Blob([payload],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`HAOS_ENCRYPTED_${formatToday()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);notify('Зашифрованная копия создана. Не теряй пароль.')}catch(e){console.error(e);notify('Не получилось создать копию')}}
async function importBackup(file){if(!file)return;try{if(file.size>15*1024*1024)throw new Error('Слишком большой файл');const raw=JSON.parse(await file.text());let restored;if(raw?.format==='haos-encrypted-backup-v2'&&raw.vault){const password=prompt('Пароль от импортируемой резервной копии:');if(password===null)return;const opened=await decryptState(raw.vault,password);restored=opened.data;}else if(Array.isArray(raw.tasks)&&Array.isArray(raw.entries)&&Array.isArray(raw.projects)){if(!confirm('Это НЕЗАШИФРОВАННАЯ копия старой версии. После импорта она будет зашифрована. Продолжить?'))return;restored=validateData(raw)}else throw new Error('Неверный формат копии');if(!confirm('Восстановление ЗАМЕНИТ все текущие записи! Сначала сделай копию. Продолжить?'))return;const clean=blank();for(const key of ['tasks','entries','projects'])clean[key]=restored[key].filter(x=>x&&typeof x==='object'&&typeof x.id==='string'&&typeof x.title==='string').map(x=>{const normalized={...x};for(const k of Object.keys(normalized))if(typeof normalized[k]==='string')normalized[k]=normalized[k].slice(0,k==='body'||k==='detail'||k==='description'?20000:200);if(key==='entries'&&!['journal','note','idea'].includes(normalized.type))normalized.type='note';return normalized});await persistQueue;data=clean;await save();go('today');notify('Копия восстановлена в зашифрованный сейф ♥')}catch(err){notify('Не удалось восстановить: '+err.message)}finally{$('#importFile').value=''}}
function handleAction(el){const action=el.dataset.action,id=el.dataset.id;if(!action)return;switch(action){case 'add-idea':openForm('idea');break;case 'add-task':openForm('task',null,view==='project'?activeProjectId:null);break;case 'add-entry':chooseType();break;case 'add-project':openForm('project');break;case 'choose':openForm(el.dataset.type);break;case 'toggle-task':toggleTask(id);break;case 'edit-task':openForm('task',id);break;case 'edit-entry':{const e=data.entries.find(x=>x.id===id);if(e)openForm(e.type,id);break}case 'edit-project':openForm('project',id);break;case 'add-project-task':openForm('task',null,id);break;case 'add-project-note':openForm('note',null,id);break;case 'task-filter':taskFilter=el.dataset.filter;render();break;case 'entry-filter':entryFilter=el.dataset.filter;render();break;case 'close-modal':closeModal();break;case 'open-project':activeProjectId=id;go('project');break;case 'projects':go('projects');break;case 'more':go('more');break;case 'settings':go('settings');break;case 'delete':removeRecord(el.dataset.kind,id);break;case 'lock-vault':lockVault();break;case 'export':downloadBackup();break;case 'import':$('#importFile').click();break;case 'clear-all':if(confirm('Точно удалить ВСЁ? Сначала сделай резервную копию.'))if(confirm('Последнее предупреждение: все записи исчезнут с этого устройства.')){data=blank();save();go('today');notify('Все данные удалены')}break;}}
document.addEventListener('click',event=>{if(event.target.id==='backdrop'){closeModal();return}const actionEl=event.target.closest('[data-action]');if(actionEl){handleAction(actionEl);return}const navEl=event.target.closest('[data-nav]');if(navEl){go(navEl.dataset.nav);return}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal.innerHTML)closeModal();if((event.key==='Enter'||event.key===' ')&&event.target.matches('[role="button"][data-action]')){event.preventDefault();handleAction(event.target)}});
document.addEventListener('submit',event=>{if(event.target.id==='recordForm')submitForm(event)});
$('#addQuick').addEventListener('click',chooseType);
$('#searchToggle').addEventListener('click',()=>{const panel=$('#searchPanel');panel.classList.toggle('hidden');if(!panel.classList.contains('hidden'))$('#globalSearch').focus();else{query='';$('#globalSearch').value='';render()}});
$('#clearSearch').addEventListener('click',()=>{query='';$('#globalSearch').value='';$('#searchPanel').classList.add('hidden');render()});
$('#globalSearch').addEventListener('input',event=>{query=event.target.value;render()});
$('#importFile').addEventListener('change',event=>importBackup(event.target.files?.[0]));
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline mode registration failed:',err));
initializeVault();
})();

</script>
</body>
</html>

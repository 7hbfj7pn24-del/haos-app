/* ХАОС: шифрованный личный сейф */
body.is-locked .app-shell,body.is-locked #modalRoot,body.is-locked #toast{display:none!important}
.auth-screen{position:fixed;inset:0;z-index:200;background:#0e1015;display:flex;align-items:center;justify-content:center;padding:28px 23px calc(30px + env(safe-area-inset-bottom));overflow:auto}
.auth-screen.hidden{display:none}
.auth-card{width:100%;max-width:390px;padding:28px 24px;background:linear-gradient(145deg,#252038,#171923);border:1px solid #514269;border-radius:25px;box-shadow:0 25px 60px #08060b80}
.auth-icon{display:grid;place-items:center;width:54px;height:54px;border-radius:18px;background:#342943;color:#d4befd;font-size:28px;margin-bottom:22px}
.auth-title{font-size:30px;letter-spacing:-.045em;line-height:1.1;margin:0 0 10px}
.auth-copy{font-size:14px;line-height:1.55;color:#c6bfd1;margin:0 0 23px}
.auth-field{display:block;margin:0 0 15px}
.auth-field span{display:block;font-size:12px;font-weight:700;color:#d6cede;margin:0 0 8px}
.auth-field input{width:100%;min-height:51px;background:#101118;border:1px solid #514663;border-radius:14px;color:#fff;padding:12px 15px;font-size:17px;outline:none}
.auth-field input:focus{border-color:#bda5f5}
.auth-submit{width:100%;margin-top:5px;font-size:15px}
.auth-error{min-height:18px;margin:12px 0 0;color:#f0a7b4;font-size:12px;line-height:1.5}
.auth-foot{margin:18px 0 0;color:#aaa5b9;font-size:11px;line-height:1.6}
.hero:after{content:''!important}

/* ХАОС 1.2: фотоссылки, миниатюры, безопасное резервирование */
.photo-picker{margin:2px 0 19px;border:1px solid #474153;border-radius:16px;padding:14px;background:#20212b}
.photo-picker-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px;color:#eee4fb;font-size:13px;font-weight:750}
.photo-picker-help{font-size:11px;color:#aaa6bb;line-height:1.5;margin:0 0 12px}
.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.photo-tile{position:relative;min-height:89px;aspect-ratio:1;background:#12131c;border:1px solid #4c435b;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.photo-tile img{width:100%;height:100%;object-fit:cover;display:block}
.photo-tile .photo-remove{position:absolute;right:5px;top:5px;width:28px;height:28px;border-radius:50%;border:0;background:#17151bdf;color:#fff;font-size:20px;line-height:1;z-index:3}
.photo-tile.add-tile{border-style:dashed;color:#ccbcf7;font-size:12px;flex-direction:column;gap:5px}
.photo-count{color:#aaa6bb;font-size:11px;margin-top:10px}
.entry-photos{display:flex;gap:7px;overflow:hidden;margin:11px 0 1px}
.entry-photo{width:72px;height:72px;object-fit:cover;border:1px solid #514a61;border-radius:10px;background:#24232d}.entry-photo{cursor:zoom-in}.photo-viewer{width:100%;max-height:65dvh;object-fit:contain;border-radius:13px;background:#101017}
.entry-photo-more{display:flex;align-items:center;justify-content:center;color:#c9bbdf;border:1px solid #514a61;border-radius:10px;padding:10px;font-size:12px}
.backup-status{display:inline-block;border-radius:12px;padding:8px 11px;margin:9px 0;background:#2a2436;color:#d9c6ff;font-size:12px}
.backup-warning{border:1px solid #71603d;background:#342d23;color:#f0daab;border-radius:16px;padding:14px 15px;margin:0 0 18px;font-size:12px;line-height:1.6}
.backup-warning button{font-weight:800;background:transparent;color:#fff0bd;border:0;padding:5px 0;margin-top:5px}

.cloud-card{border-color:#554965}
.cloud-status{font-size:12px;color:#cab5ff;background:#282233;padding:10px 12px;border-radius:10px;line-height:1.5;margin:12px 0}
.cloud-fields{display:grid;gap:10px;margin:15px 0}
.cloud-fields input{background:#101218;border:1px solid #454455;border-radius:12px;min-height:48px;padding:12px;color:#fff;font-size:16px;width:100%;box-sizing:border-box}
.cloud-fields input:focus{outline:2px solid #b69fe3}
.cloud-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}
.cloud-actions button{flex:1 1 auto;min-width:140px}

/*
  ХАОС / BORDEAUX
  Visual-only theme for v1.4.1. App logic, data keys, storage,
  encryption, cloud sync and backups are intentionally untouched.
*/
:root {
  color-scheme: dark;
  --bg: #0a080a;
  --panel: #171216;
  --panel2: #21171d;
  --line: #39252d;
  --text: #fff9f8;
  --muted: #bdadb4;
  --dim: #93828a;
  --accent: #e17b94;
  --accentdim: #44202c;
  --pink: #ed8ca5;
  --green: #f0c9d2;
  --radius: 21px;
  --wine: #8c2943;
  --wine-deep: #53172a;
  --wine-border: #754052;
  --ivory: #fff9f8;
  --wine-surface: #25151d;
}
html, body { background-color: var(--bg); }
body {
  color: var(--text);
  background-image: radial-gradient(ellipse 85% 500px at 95% -115px, rgba(103, 23, 46, .24), transparent 76%),
                    radial-gradient(ellipse 380px 420px at -195px 70%, rgba(77, 18, 37, .11), transparent 84%);
  background-attachment: fixed;
}
::selection { background: #8a2b46; color: white; }
.ambient { opacity: .14; filter: blur(80px); }
.ambient-one { background: #6b1730; right: -185px; top: -100px; }
.ambient-two { background: #4a1226; left: -205px; opacity: .085; }

/* Masthead: matte oxblood enamel rather than the original emoji tile. */
.topbar { padding-bottom: 24px; }
.brand-wrap { gap: 13px; }
.logo-mark {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: linear-gradient(150deg, #a42e4c 0%, #671c33 62%, #43101f 100%);
  border: 1px solid #a24f67;
  box-shadow: inset 0 1px 0 #edbac333, 0 9px 23px #09050788;
  font-size: 0;
  overflow: hidden;
}
.logo-mark::before {
  content: '✳︎';
  font: 500 31px/1 Georgia, serif;
  color: #fff6f4;
  text-shadow: 0 0 0 transparent;
}
.brand { font-weight: 850; letter-spacing: .115em; font-size: 19px; color: #fffaf9; }
.brand-dot { color: #dc6986; }
.brand-caption { color: #b6a3ac; letter-spacing: .065em; }
.icon-button {
  background: #1a1217;
  color: #fff5f5;
  border-color: #422b34;
  box-shadow: inset 0 1px 0 #ffffff07;
}
.local-badge { background: #181115; border-color: #47303b; color: #e2d4d8; }
.status-light { background: #f1d3db; box-shadow: 0 0 0 3px #8c29432b, 0 0 10px #d8799350; }
.search-panel input { background: #151015; border: 1px solid #724155; color: #fff; }
.search-panel input:focus { box-shadow: 0 0 0 3px #b7436338; border-color: #c3627e; }

/* Type and page rhythm. */
.eyebrow { color: #e49aab; font-size: 10px; letter-spacing: .22em; }
.page-title { color: var(--text); font-weight: 800; letter-spacing: -.058em; }
.page-subtitle { color: #c2afb6; }
.count-info { color: #a8959d; }
.section-header { margin-top: 28px; }
.section-header h2 { font-weight: 750; color: #fff7f7; }
.section-header:has(h2) { border-bottom: 1px solid #39252d; padding-bottom: 8px; }

/* Signature front-page card. */
.hero {
  background:
    radial-gradient(ellipse 280px 230px at 115% -10%, #b6426061, transparent 83%),
    linear-gradient(132deg, #4f142b 0%, #2f101d 48%, #1b1016 100%);
  border: 1px solid #91435a;
  border-radius: 23px;
  box-shadow: inset 0 1px 0 #ffffff1a, 0 18px 50px #05030555;
  padding: 25px 24px 24px;
}
.hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 24px;
  height: 2px;
  width: 74px;
  background: #f2b4c2;
  box-shadow: 0 0 12px #cd657c50;
}
.hero:after {
  content: '✳︎' !important;
  position: absolute;
  right: -4px;
  top: -18px;
  font: 150px/1 Georgia, serif;
  color: #f9dce60f;
  pointer-events: none;
  transform: rotate(9deg);
}
.hero h1 { color: #fff9f7; font-weight: 830; }
.hero p { color: #e0c5cd; }
.hero .eyebrow { color: #ffc6d2; }
.primary-button {
  background: linear-gradient(140deg, #a72e4d 0%, #80213b 100%);
  color: #fff9fa;
  border: 1px solid #c05773;
  border-radius: 13px;
  box-shadow: inset 0 1px 0 #fff5f424, 0 6px 18px #14040b50;
  font-weight: 750;
}
.primary-button:active { filter: brightness(1.13); transform: translateY(1px); }
.soft-button {
  background: #292027;
  border-color: #44313a;
  color: #f8edef;
}
.ghost-button { color: #f09bb0; }
.ghost-button:active, .mini-link:active { color: #fff7f8; }

/* Stats, records, filters. */
.stat {
  background: linear-gradient(160deg, #21171c, #151115 90%);
  border-color: #39272f;
  border-radius: 18px;
  position: relative;
  overflow: hidden;
}
.stat::before { content: ''; position: absolute; left: 14px; top: 0; width: 30px; height: 2px; background: #934058; }
.stat-number { color: #fff8f7; font-weight: 780; }
.stat-number.purple { color: #f2b1c0; }
.stat-number.pink { color: #fff8f6; }
.stat-number.green { color: #e48da4; }
.stat-caption { color: #b4a1a9; }
.card {
  background: linear-gradient(156deg, #1d151a 0%, #171216 82%);
  border-color: #39262f;
  border-radius: 19px;
  box-shadow: inset 0 1px 0 #ffffff04;
}
.card.card-clickable { transition: border-color .16s ease, background .16s ease; }
.card.card-clickable:active { background: #26171f; border-color: #98566a; }
.card-head .card-title { color: #fff8f7; }
.card-title { color: #fff8f7; }
.card-body { color: #ccbbc1; }
.meta { color: #9b8991; }
.entry-mark { color: #eda1b4; }
.entry-photos { gap: 9px; }
.entry-photo { border-color: #875263; background: #24171e; }
.entry-photo-more { color: #f4ced7; border-color: #794458; }
.pill {
  background: #3c202b;
  color: #f2c6d0;
  border: 1px solid #5d3443;
  font-weight: 700;
}
.pill.green { background: #272126; color: #f7e3e6; border-color: #53404a; }
.pill.pink { background: #4b2333; color: #ffd4df; border-color: #814157; }
.pill.amber { background: #3b2927; color: #f1c6b5; border-color: #6c4840; }
.task-checkbox { border-color: #9f7785; color: #f4b5c4; }
.task-checkbox.checked { border-color: #d8899e; background: #59283a; color: white; }
.task-text.done .card-title { color: #96858c; }
.task-details { color: #c3b2b9; }
.empty { background: #191216bf; border-color: #65404c; }
.empty-symbol { color: #e59bb1; }
.chip { background: #171115; border-color: #44303a; color: #c9b7be; }
.chip.active {
  color: #fff9f8;
  background: linear-gradient(140deg, #7c243d, #552032);
  border-color: #ac536d;
  box-shadow: inset 0 1px 0 #ffdee329;
}
.more-item { background: #1a1419; border-color: #3d2932; }
.more-icon { background: #49202f; color: #ffbfce; }
.chevron { color: #bb9da9; }
.info-box { background: #281921; border-color: #6e3d4e; color: #e5cbd3; }
.project-dot { background: #ab3b57; }
.project-label, .footer-note { color: #aa929e; }
.mini-link { color: #efa6b9; }

/* Bottom bar: strong black silhouette, maroon active state, ivory +. */
.bottom-nav {
  background: #100c10f5;
  border-top: 1px solid #57323e;
  box-shadow: 0 -15px 34px #0a060b88;
}
.nav-link { color: #9b8b93; }
.nav-link.active { color: #fff6f6; }
.nav-link.active .nav-symbol { color: #e689a1; text-shadow: 0 0 15px #b8476540; }
.nav-add {
  background: #fff9f7;
  color: #76213b;
  border: 1px solid #fff;
  border-radius: 17px;
  box-shadow: 0 8px 28px #03020475, 0 0 0 4px #9b34471f;
}
.nav-add:active { background: #f9dfe4; }

/* Editing, sheets, form elements and accessible focus treatment. */
.modal-backdrop { background: #050305cb; }
.sheet {
  background: #1a1218;
  border-color: #6b3b4b;
  box-shadow: 0 -25px 65px #050305cc;
}
.sheet-handle { background: #825466; }
.sheet-title { color: #fff9f8; }
.close-button { background: #2b2028; border-color: #513542; color: #fff0f2; }
.field-label { color: #ead5dc; }
.field input, .field textarea, .field select {
  background: #0d0b0e;
  border-color: #51333e;
  color: #fff9f8;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: #d0718a; box-shadow: 0 0 0 3px #a5436136; }
.field input::placeholder, .field textarea::placeholder { color: #917b85; }
.danger-button { border-color: #9b4257; color: #ffc1cf; background: #2b151e; }
.choose-card { background: #241820; border-color: #624052; }
.choose-icon { color: #ed92ac; }
.toast { background: #fff8f6; color: #521728; box-shadow: 0 15px 30px #080307a3; }

/* Password screen. */
.auth-screen {
  background: #0b080a;
  background-image: radial-gradient(ellipse 75% 48% at 50% 17%, #45182a77, transparent);
}
.auth-card {
  background: linear-gradient(155deg, #291823 0%, #181116 69%, #130e12 100%);
  border-color: #815064;
  box-shadow: 0 25px 75px #000000a8, inset 0 1px 0 #f9c7d015;
}
.auth-icon {
  color: #fff7f6;
  background: linear-gradient(145deg, #a33251, #54182d);
  border: 1px solid #ba6079;
  box-shadow: 0 9px 20px #09040666;
}
.auth-title { color: #fff9f8; }
.auth-copy { color: #e0cbd2; }
.auth-field span { color: #e7d0d7; }
.auth-field input { background: #100b10; border-color: #684352; }
.auth-field input:focus { border-color: #df88a2; box-shadow: 0 0 0 3px #a43c5a3d; }
.auth-error { color: #ffb5c5; }
.auth-foot { color: #bfa6b0; }

/* Photo library, cloud, backups. */
.photo-picker { background: #24171e; border-color: #714355; }
.photo-picker-title { color: #fff7f6; }
.photo-picker-help, .photo-count { color: #cab4bd; }
.photo-tile { background: #150e13; border-color: #714052; }
.photo-tile.add-tile { color: #ffd0dd; }
.photo-tile .photo-remove { background: #290d19e6; color: white; }
.photo-viewer { background: #0d0a0e; }
.backup-status { background: #4a2535; color: #ffd6e1; }
.backup-warning { background: #39252a; border-color: #865468; color: #ffe4df; }
.backup-warning button { color: #fff4f2; }
.cloud-card { border-color: #674050; }
.cloud-status { background: #3b2130; color: #f1c4d2; border: 1px solid #62384b; }
.cloud-fields input { background: #0d0b0d; color: white; border-color: #633d4b; }
.cloud-fields input:focus { outline: 2px solid #c76582; outline-offset: 1px; }
.cloud-actions button { flex: 1 1 auto; }

button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible,
[role='button']:focus-visible { outline: 2px solid #efabc1; outline-offset: 3px; }
@media (hover:hover) {
  .primary-button:hover { filter: brightness(1.12); }
  .soft-button:hover, .icon-button:hover { border-color: #895062; }
  .chip:not(.active):hover { background: #261820; }
}
@media (prefers-reduced-motion: reduce) {
  .main-content { animation: none; }
  .card.card-clickable, .primary-button { transition: none; }
}

.v2-ch-cover>span{font-size:12px;font-weight:700;color:#fceaf2;background:#391a27b8;padding:7px 11px;border:1px solid #a35668;border-radius:30px}
.v2-ch-cover.v2-big-cover{height:185px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:12px;margin:12px 0 23px;border-radius:19px;overflow:hidden}
.v2-ch-cover h2{font-family:Manrope,sans-serif;margin:0;font-size:23px;max-width:100%;overflow-wrap:break-word}
.v2-ch-inner{padding:16px;display:grid;gap:8px}.v2-ch-inner>strong{font-size:18px}.v2-muted{font-size:12px;color:#c7abb7}
.v2-ch-stats{display:flex;justify-content:space-between;gap:6px;color:#f3e1e8;font-size:13px;margin:10px 0}.v2-progress{height:9px;background:#3e2b35;border-radius:10px;overflow:hidden;margin-bottom:10px}.v2-progress i{height:100%;display:block;background:linear-gradient(90deg,#7a1636,#d45f80);border-radius:10px}
.v2-ch-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:20px 0 22px}.v2-day{min-width:0;aspect-ratio:1/1;display:grid;place-items:center;border-radius:12px;border:1px solid #46313a;background:#25191e;color:#fff2f5;font-size:12px;padding:0}
.v2-day.marked{background:linear-gradient(145deg,#912e4c,#5b1a31);border-color:#9c3c5a}.v2-day.selected{outline:2px solid #f0b7c8;outline-offset:1px}
.v2-day-detail{padding:17px}.v2-day-detail h3{margin:5px 0;font-size:21px}.v2-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}.v2-row>*{min-width:0}.v2-row>.primary-button{flex:1}
.v2-day-photo{max-height:270px;max-width:100%;width:100%;object-fit:cover;border-radius:14px;margin-top:10px}.v2-danger{color:#ffc2d2!important}
.v2-cal{padding:18px 13px}.v2-cal>.v2-row{margin:0 0 15px}.v2-cal>.v2-row>strong{font-family:Manrope;font-size:17px;text-transform:capitalize}
.v2-cal-arrow{width:38px;height:38px;border:1px solid #573b49;background:#26151e;color:white;border-radius:11px;font-size:24px}
.v2-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.v2-cal-week{color:#c3adb5;font-size:11px;padding:8px 0}.v2-cal-day{min-width:0;aspect-ratio:1;display:grid;place-items:center;border:0;background:transparent;color:#f8ebef;border-radius:11px;position:relative;font-size:13px;padding:0}
.v2-cal-day.has-events:after{content:'';width:4px;height:4px;background:#eb7391;border-radius:50%;position:absolute;bottom:2px}.v2-cal-day.selected{background:#912e4c}.v2-day-h{font-size:18px;margin:0;font-family:Manrope}
.v2-event{display:flex;align-items:flex-start;gap:10px;padding:14px;margin:9px 0}.v2-event-check{background:transparent;border:1px solid #6d4153;color:white;border-radius:8px;font-size:17px;min-width:31px;min-height:31px}.v2-event-check.done{background:#91304c}.v2-event-text{flex:1;min-width:0}.v2-event-text strong{font-size:14px;overflow-wrap:break-word}.v2-event-text small{display:block;color:#bdabb5;margin-top:4px}.v2-event-text p{color:#dac5cc;font-size:12px;margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.v2-form-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.v2-form-columns>.field{min-width:0}.v2-form-columns input{width:100%;min-width:0;max-width:100%}.v2-color-picker{display:grid;gap:12px;margin:8px 0 18px}.v2-color-swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.v2-color-swatch{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:16px;border:1px solid #5a3945;background:#171018;color:#f7f0f2;text-align:left}.v2-color-swatch.active{border-color:#ef9cb3;box-shadow:0 0 0 1px #ef9cb355 inset,0 12px 24px #00000033}.v2-color-dot{width:18px;height:18px;border-radius:999px;border:1px solid #ffffff40;box-shadow:0 1px 7px #00000040}.v2-color-dot.big{width:24px;height:24px}.v2-color-name{font-size:13px;font-weight:700;line-height:1.2}.v2-color-hex{font-size:11px;color:#c7b3ba}.v2-color-custom{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:end}.v2-color-wheel{width:52px;height:52px;border:0;border-radius:14px;background:#111319;padding:0;overflow:hidden}.v2-color-wheel::-webkit-color-swatch-wrapper{padding:0}.v2-color-wheel::-webkit-color-swatch{border:none;border-radius:14px}.v2-color-preview{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:#171018;border:1px solid #4f313c}.v2-color-preview strong{display:block;font-size:14px}.v2-color-preview small{display:block;font-size:11px;color:#c7b3ba}.pill-button{border:0;cursor:pointer}
.v2-style-cover .v2-cover{height:150px;border-radius:17px}.v2-style-row{display:flex;gap:10px;margin:14px 0}.v2-style-row>*{flex:1}.v2-appearance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}.v2-appearance-grid>div{display:flex;flex-direction:column;gap:10px;min-width:0}.v2-appearance-grid strong{font-size:13px}.v2-preview-img{height:110px;max-width:100%;object-fit:cover;border-radius:15px;border:1px solid #784358}.v2-small-note{font-size:12px;color:#cdb1be;line-height:1.5}.v2-empty-hint{font-size:13px;color:#bdabb5;margin:20px 0}
.v2-splash{position:fixed;z-index:9000;inset:0;background:#080507;opacity:0;pointer-events:none;transition:opacity .35s}.v2-splash.show{opacity:1;pointer-events:all}.v2-splash-art{position:absolute;inset:4% 0 10%;display:flex;align-items:center;justify-content:center}.v2-splash-art img{width:min(100vw,500px);max-height:82%;object-fit:contain}.v2-splash-type{position:absolute;bottom:15%;width:100%;text-align:center;color:#fff;font:800 37px Manrope,sans-serif;letter-spacing:.1em;text-shadow:0 2px 24px #000}.v2-splash-type span{color:#df7797}.v2-splash-type small{display:block;font:400 12px Onest,sans-serif;letter-spacing:.17em;color:#d8c0c9;margin-top:8px}
@media(max-width:440px){.brand-caption{display:none}.v2-form-columns,.field-grid{grid-template-columns:1fr}.v2-form-columns input,.field-grid input,.field-grid select{min-width:0;max-width:100%;font-size:14px}}
@media(max-width:385px){.v2-tile{min-height:116px;padding:12px}.v2-ch-calendar{gap:4px}.v2-day{border-radius:9px}.v2-form-columns{gap:6px}.v2-cal{padding:14px 9px}}
@media(prefers-reduced-motion:reduce){.v2-splash{transition:none}}

/* 2.0.4: idea status and simple note-to-idea conversion */
.v2-entry-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.v2-idea-status,.v2-convert-idea{display:inline-flex;align-items:center;gap:8px;min-height:39px;border-radius:11px;padding:7px 12px;font-size:12px;font-weight:750;text-align:left;max-width:100%}
.v2-idea-status{border:1px solid #8c4d64;background:#39212d;color:#f4c1d0}
.v2-idea-status.is-realized{background:#20392d;border-color:#4f8b6a;color:#b4efca}
.v2-idea-status .v2-idea-check{width:18px;height:18px;min-width:18px;border:1.6px solid currentColor;border-radius:6px;display:grid;place-items:center;font-size:12px}
.v2-convert-idea{background:transparent;color:#d3a2b2;border:1px dashed #765366}
.v2-entry-type-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

  <script>
/* ХАОС v1.2.0. Личное шифрование, фото, резервные копии. Без аналитики и внешних библиотек. */
(()=>{
'use strict';
// Hard-coded sandbox mode. This preview MUST NEVER access production local storage or cloud.
const IS_PREVIEW=true; // HARD SAFETY: migration sandbox must never enable production cloud or vault namespace
const STORAGE_KEY='haos-migration-sandbox-old-data-v1';
const VAULT_KEY='haos-migration-sandbox-encrypted-vault-v1';
const BACKUP_STATUS_KEY='haos-migration-sandbox-last-backup-v1';
const BACKUP_MODIFIED_KEY='haos-migration-sandbox-last-change-v1';
const PHOTO_LIMIT=8;
let photoDraft=null,photoDraftBusy=false;
const photoURLCache=new Map();
let photoDatabasePromise=null;
const KDF_ITERATIONS=310000;
const blank=()=>({version:2,tasks:[],entries:[],projects:[],challenges:[],events:[],appearance:{}});
let data=blank();
let activeKey=null, vaultSalt=null, persistQueue=Promise.resolve(), vaultBusy=false;
let view='today',entryFilter='all',taskFilter='active',activeProjectId=null,query='',toastTimer;
const $=sel=>document.querySelector(sel);
const main=$('#app'),modal=$('#modalRoot');
const moods=[['😌','Спокойно'],['🙂','Нормально'],['🥹','Трогательно'],['😤','Бесит'],['🫠','Хаос'],['💜','Хорошо']];
const typeNames={journal:'Дневник',note:'Заметка',idea:'Идея'};
const typeIcons={journal:'☾',note:'▤',idea:'✦'};
const formatToday=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const readableDate=val=>{if(!val)return '';const d=new Date((/^\d{4}-\d{2}-\d{2}$/.test(val)?val+'T12:00:00':val));return Number.isFinite(d.getTime())?new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',year:'numeric'}).format(d):''};
const readableMoment=val=>{if(!val)return '';const d=new Date(val);if(!Number.isFinite(d.getTime()))return '';const date=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',year:'numeric'}).format(d);const hour=new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d);return `${date}, ${hour}`};
const readableWeekday=()=>new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shorten=(s,n=135)=>{s=String(s||'').trim();return s.length>n?s.slice(0,n).trim()+'…':s};
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const time=()=>new Date().toISOString();
function load(){try{const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY));if(parsed)return validateData(parsed)}catch(e){console.warn('Unable to load local storage',e)}return blank()}

function toBase64(bytes){let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s)}
function fromBase64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function validateData(raw){if(!raw||!Array.isArray(raw.tasks)||!Array.isArray(raw.entries)||!Array.isArray(raw.projects))throw new Error('Повреждённые данные');if(Number(raw.version)>2)throw new Error('Этот сейф создан в более новой версии ХАОСа. Не открывай его старой версией.');return {version:2,tasks:raw.tasks,entries:raw.entries,projects:raw.projects,challenges:Array.isArray(raw.challenges)?raw.challenges:[],events:Array.isArray(raw.events)?raw.events:[],appearance:raw.appearance&&typeof raw.appearance==='object'?raw.appearance:{}}}
async function deriveKey(pass,salt,iterations=KDF_ITERATIONS){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptState(key,state,salt){const iv=crypto.getRandomValues(new Uint8Array(12));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(state)));return {version:2,kdf:'PBKDF2-SHA256',iterations:KDF_ITERATIONS,salt:toBase64(salt),iv:toBase64(iv),ciphertext:toBase64(new Uint8Array(cipher))}}
async function decryptState(vault,pass){if(vault.version!==2||vault.kdf!=='PBKDF2-SHA256'||vault.iterations<100000||vault.iterations>2000000)throw new Error('Неизвестный формат сейфа');const salt=fromBase64(vault.salt);const key=await deriveKey(pass,salt,vault.iterations);const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromBase64(vault.iv)},key,fromBase64(vault.ciphertext));const decoded=JSON.parse(new TextDecoder().decode(plaintext));return {key,salt,data:validateData(decoded),sourceVersion:Number(decoded.version)||1}}
function getVault(){try{const raw=localStorage.getItem(VAULT_KEY);return raw?JSON.parse(raw):null}catch(e){return {corrupted:true}}}
function save(){if(!activeKey||!vaultSalt)return Promise.reject(new Error('Сейф закрыт'));const snapshot=JSON.parse(JSON.stringify(data));const key=activeKey,salt=vaultSalt;persistQueue=persistQueue.catch(()=>{}).then(async()=>{const encrypted=await encryptState(key,snapshot,salt);localStorage.setItem(VAULT_KEY,JSON.stringify(encrypted));markedAsChanged();cloudSchedule();return true}).catch(err=>{console.error('Save failed',err);notify('Не удалось сохранить! Сделай копию и проверь память телефона.');throw err});return persistQueue}
function setAuthMode(mode){const create=mode==='create';$('#authTitle').textContent=create?'Создай свой пароль':'С возвращением в ХАОС';$('#authCopy').textContent=create?'Задай длинный личный пароль. Все записи будут зашифрованы на этом устройстве.':'Доступ к дневнику только после расшифровки записей.';$('#authRepeatLabel').classList.toggle('hidden',!create);$('#authRepeat').required=create;$('#authSubmit').textContent=create?'Создать защищённый ХАОС':'Разблокировать';$('#authPassword').setAttribute('minlength',create?'12':'1');$('#authPassword').value='';$('#authRepeat').value='';$('#authError').textContent='';document.body.classList.add('is-locked');$('#authScreen').classList.remove('hidden');}
async function initializeVault(){if(!globalThis.crypto?.subtle){setAuthMode('unlock');$('#authCopy').textContent='В этом браузере недоступно шифрование. Открой ХАОС по HTTPS в Safari.';$('#authSubmit').disabled=true;return;}const vault=getVault();setAuthMode(vault?'unlock':'create');if(vault?.corrupted)$('#authError').textContent='Хранилище повреждено. Не удаляй данные. Сделай копию перед восстановлением.'}
async function unlockWithPass(pass){const vault=getVault();if(vault){const opened=await decryptState(vault,pass);activeKey=opened.key;vaultSalt=opened.salt;data=opened.data;if(opened.sourceVersion<2)await save();}else{vaultSalt=crypto.getRandomValues(new Uint8Array(16));activeKey=await deriveKey(pass,vaultSalt);data=load();await save();localStorage.removeItem(STORAGE_KEY);}view='today';query='';$('#globalSearch').value='';$('#searchPanel').classList.add('hidden');$('#authScreen').classList.add('hidden');document.body.classList.remove('is-locked');render();v2PostUnlock();if(cloudEnabled)cloudSchedule();if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});}
async function lockVault(){if(document.body.classList.contains('is-locked')||vaultBusy)return;vaultBusy=true;try{await persistQueue}catch(e){};activeKey=null;vaultSalt=null;data=blank();resetPhotoDraft();clearPhotoURLs();main.innerHTML='';modal.innerHTML='';setAuthMode('unlock');vaultBusy=false;}
$('#authForm').addEventListener('submit',async event=>{event.preventDefault();if(vaultBusy)return;const pass=$('#authPassword').value;const isCreate=!getVault();$('#authError').textContent='';if(isCreate&&(pass.length<12||pass!==$('#authRepeat').value)){ $('#authError').textContent=pass.length<12?'Нужно хотя бы 12 символов. Лучше длинную фразу.':'Пароли не совпадают.';return;}vaultBusy=true;$('#authSubmit').disabled=true;try{await unlockWithPass(pass);}catch(e){activeKey=null;vaultSalt=null;data=blank();$('#authError').textContent=getVault()?.corrupted?'Повреждены данные сейфа.':'Не получилось открыть: неверный пароль или повреждённая копия.';console.warn('Unable to unlock local vault',e)}finally{vaultBusy=false;$('#authSubmit').disabled=false;$('#authPassword').value='';$('#authRepeat').value=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)lockVault()});


function openPhotoDB(){
 if(!('indexedDB' in window))return Promise.reject(new Error('Нет доступа к IndexedDB на этом устройстве'));
 if(!photoDatabasePromise){photoDatabasePromise=new Promise((resolve,reject)=>{
   const request=indexedDB.open('haos-migration-sandbox-photos-v1',1);
   request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('photos'))request.result.createObjectStore('photos',{keyPath:'id'})};
   request.onsuccess=()=>resolve(request.result);
   request.onerror=()=>reject(request.error||new Error('Хранилище фотографий недоступно'));
 }).catch(error=>{photoDatabasePromise=null;throw error})}
 return photoDatabasePromise;
}
async function photoDBGet(id){const db=await openPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly');const req=tx.objectStore('photos').get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);tx.onerror=()=>reject(tx.error)})}
async function photoDBPut(item){const db=await openPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(item);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Ошибка сохранения фото'))})}
async function photoDBDelete(id){const db=await openPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
async function photoDBClear(){const db=await openPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').clear();tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
async function storePhotoWithKey(id,mime,bytes,key){
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);
 await photoDBPut({id,mime:'image/jpeg',iv:iv.buffer,ciphertext,version:1});
}
async function decryptPhotoWithKey(item,key){
 if(!item||item.version!==1||!item.iv||!item.ciphertext)throw new Error('Не найдено зашифрованное фото');
 return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(item.iv)},key,item.ciphertext);
}
async function getPhotoURL(id){
 if(!activeKey||!id)return '';
 if(photoURLCache.has(id))return photoURLCache.get(id);
 const item=await photoDBGet(id);if(!item)return '';
 const buffer=await decryptPhotoWithKey(item,activeKey);
 if(!activeKey)return '';
 const url=URL.createObjectURL(new Blob([buffer],{type:'image/jpeg'}));photoURLCache.set(id,url);return url;
}
async function hydratePhotos(root=document){
 const nodes=Array.from(root.querySelectorAll('img[data-photo-id]'));
 const keyBefore=activeKey;
 for(const node of nodes){
   try{const url=await getPhotoURL(node.dataset.photoId);if(keyBefore===activeKey&&url&&node.isConnected)node.src=url}
   catch(err){console.warn('Не удалось открыть фотографию',err);node.alt='Не удалось загрузить фото'}
 }
}
function clearPhotoURLs(){for(const url of photoURLCache.values())URL.revokeObjectURL(url);photoURLCache.clear()}
function resetPhotoDraft(){if(photoDraft){for(const item of photoDraft.added){URL.revokeObjectURL(item.previewURL)}}photoDraft=null;photoDraftBusy=false}
function photoPreviews(photos,mode='entry'){
 const list=Array.isArray(photos)?photos:[];
 if(!list.length)return '';
 return mode==='entry'?`<div class="entry-photos">${list.slice(0,4).map(p=>`<img class="entry-photo" data-photo-id="${escape(p.id)}" alt="Фото-референс">`).join('')}${list.length>4?`<span class="entry-photo-more">+${list.length-4}</span>`:''}</div>`:'';
}
function photoPickerMarkup(){
 if(!photoDraft)return '';
 const existing=photoDraft.existing.map(p=>`<div class="photo-tile"><img data-photo-id="${escape(p.id)}" alt="${escape(p.name||'Фото')}"><button type="button" class="photo-remove" data-action="remove-photo" data-photo-id="${escape(p.id)}" aria-label="Убрать фото">×</button></div>`);
 const added=photoDraft.added.map(p=>`<div class="photo-tile"><img src="${escape(p.previewURL)}" alt="${escape(p.meta.name||'Новое фото')}"><button type="button" class="photo-remove" data-action="remove-photo" data-photo-id="${escape(p.meta.id)}" aria-label="Убрать фото">×</button></div>`);
 const count=existing.length+added.length;
 return `<div class="photo-picker"><div class="photo-picker-title"><span>📷 Фото и референсы</span><span>${count}/${PHOTO_LIMIT}</span></div><p class="photo-picker-help">Выбери фото из галереи. Оно останется внутри этой записи и будет зашифровано. Без внешних ссылок и дисков.</p><div class="photo-grid">${existing.join('')}${added.join('')}${count<PHOTO_LIMIT?`<button class="photo-tile add-tile" type="button" data-action="pick-photos"><span style="font-size:27px">＋</span><span>Добавить фото</span></button>`:''}</div><input id="photoFilePicker" type="file" accept="image/*" multiple hidden><div class="photo-count">${photoDraftBusy?'Обрабатываю фото…':'До 8 фотографий на одну запись, размер уменьшается для экономии памяти'}</div></div>`;
}
function updatePhotoPicker(){const node=modal.querySelector('#photoPickerSlot');if(node){node.innerHTML=photoPickerMarkup();hydratePhotos(node)}}
async function optimizePhoto(file){
 if(!file.type.startsWith('image/'))throw new Error('Можно добавить только фото');
 if(file.size>28*1024*1024)throw new Error('Фото слишком большое (максимум 28 МБ)');
 const url=URL.createObjectURL(file);let img;
 try{img=await new Promise((resolve,reject)=>{const el=new Image();el.onload=()=>resolve(el);el.onerror=()=>reject(new Error('Формат фото не поддерживается'));el.src=url});
   const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
   const width=Math.max(1,Math.round(img.naturalWidth*scale)),height=Math.max(1,Math.round(img.naturalHeight*scale));
   const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
   const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)throw new Error('Не удалось обработать фото');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.drawImage(img,0,0,width,height);
   const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Не удалось сжать фото')),'image/jpeg',.8));
   return {meta:{id:uid(),name:String(file.name||'Референс').slice(0,140),mime:'image/jpeg',size:blob.size,width,height},blob,previewURL:URL.createObjectURL(blob)};
 }finally{URL.revokeObjectURL(url)}
}
async function addPhotos(files){
 if(!photoDraft||!files?.length||photoDraftBusy)return;
 const available=PHOTO_LIMIT-photoDraft.existing.length-photoDraft.added.length;
 if(available<=0){notify('Для одной записи максимум 8 фото');return}
 photoDraftBusy=true;updatePhotoPicker();let added=0;
 try{for(const file of Array.from(files).slice(0,available)){
   if(!activeKey||!photoDraft)throw new Error('Сейф закрыт');
   const preview=await optimizePhoto(file);
   photoDraft.added.push(preview);added++;
 }}catch(err){notify('Не удалось добавить фото: '+err.message)}finally{photoDraftBusy=false;updatePhotoPicker();if(added)notify(`Добавлено фото: ${added}`)}
}
function removeDraftPhoto(id){if(!photoDraft)return;const p=photoDraft.added.find(p=>p.meta.id===id);if(p){URL.revokeObjectURL(p.previewURL);photoDraft.added=photoDraft.added.filter(x=>x.meta.id!==id)}else photoDraft.existing=photoDraft.existing.filter(p=>p.id!==id);updatePhotoPicker()}
function markedAsChanged(){try{localStorage.setItem(BACKUP_MODIFIED_KEY,new Date().toISOString())}catch(e){}}
function backupNeeded(){
 const modified=localStorage.getItem(BACKUP_MODIFIED_KEY);if(!modified)return false;
 const backup=localStorage.getItem(BACKUP_STATUS_KEY);if(!backup)return true;
 return new Date(modified)>new Date(backup);
}
function backupNotice(){if(!backupNeeded())return '';return `<div class="backup-warning">🔐 <strong>Есть записи без резервной копии.</strong> Если удалить ХАОС с iPhone, их можно потерять.<div><button data-action="export">Сохранить зашифрованную копию →</button></div></div>`}

function projectOptions(selected){return `<option value="">Без проекта</option>`+data.projects.map(p=>`<option value="${escape(p.id)}" ${p.id===selected?'selected':''}>${escape(p.title)}</option>`).join('')}

function sortedTasks(tasks){return [...tasks].sort((a,b)=>Number(a.done)-Number(b.done)||(a.due||'9999').localeCompare(b.due||'9999')||(b.createdAt||'').localeCompare(a.createdAt||''))}

const V2_COLORS=['#94304c','#b76577','#76536b','#a27a70','#706779','#5d6575'];
const V2_ICONS=['◈','◉','✦','☾','✿','♡','▣','▤','⌘','♧'];
let challengeId=null, challengeDay=1, calendarDate=formatToday(),calendarMonth=formatToday().slice(0,7);
let imageTarget=null,imageWorking=false;
function allPhotoMetas(state=data){
 const items=[];
 for(const e of state.entries||[])for(const p of e.photos||[])if(p?.id)items.push(p);
 for(const p of state.projects||[])if(p.coverPhoto?.id)items.push(p.coverPhoto);
 for(const c of state.challenges||[])for(const d of Object.values(c.days||{}))if(d?.photo?.id)items.push(d.photo);
 for(const p of [state.appearance?.logoPhoto,state.appearance?.splashPhoto])if(p?.id)items.push(p);
 return [...new Map(items.map(x=>[x.id,x])).values()];
}
function remapPhotoIds(state,mapping){
 for(const e of state.entries||[])for(const p of e.photos||[])p.id=mapping.get(p.id)||p.id;
 for(const p of state.projects||[])if(p.coverPhoto?.id)p.coverPhoto.id=mapping.get(p.coverPhoto.id)||p.coverPhoto.id;
 for(const c of state.challenges||[])for(const d of Object.values(c.days||{}))if(d?.photo?.id)d.photo.id=mapping.get(d.photo.id)||d.photo.id;
 for(const k of ['logoPhoto','splashPhoto'])if(state.appearance?.[k]?.id)state.appearance[k].id=mapping.get(state.appearance[k].id)||state.appearance[k].id;
}
function v2Ready(){return !!activeKey&&!document.body.classList.contains('is-locked')}
function v2Icon(p){return escape(p?.icon||'◈')}
function v2Project(id){return data.projects.find(p=>p.id===id)}
function v2Days(c){return Object.values(c.days||{}).filter(d=>d?.done).length}
function v2Cover(p){
 const name=String(p?.title||'').toLowerCase();const cls=name.includes('dark')||name.includes('дарк')?'archive':name.includes('работ')||name.includes('rubi')?'work':name.includes('само')?'growth':'plain';
 return `<div class="v2-cover v2-${cls}" style="--space-accent:${escape(v2NormalizeHex(p?.color)||'#94304c')}">${p?.coverPhoto?.id?`<img data-photo-id="${escape(p.coverPhoto.id)}" alt="Обложка пространства">`:''}<span class="v2-cover-shade"></span><span class="v2-cover-title"><span>${v2Icon(p)}</span> ${escape(p?.title||'Пространство')}</span></div>`;
}
function v2Tile(icon,title,detail,viewName){return `<button class="v2-tile" data-action="v2-go" data-view="${viewName}"><span class="v2-tile-icon">${icon}</span><strong>${title}</strong><small>${detail}</small></button>`}
function renderSpacesV2(){return `${pageHead('МОИ ПРОСТРАНСТВА','Пространства.','Создавай собственные разделы, меняй их обложки, значки и цвета.')}<div class="v2-space-list">${data.projects.map(p=>`<div class="v2-space-card"><button data-action="open-project" data-id="${escape(p.id)}" class="v2-space-main">${v2Cover(p)}<span class="v2-space-meta"><strong>${escape(p.title)}</strong><small>${escape(p.description||'Задачи · записи · челленджи')}</small><small>${countProject(p.id)} записей и задач · ${data.challenges.filter(c=>c.projectId===p.id).length} челленджей</small></span></button><button class="v2-edit-space" data-action="v2-style-space" data-id="${escape(p.id)}" aria-label="Оформление пространства">⋯</button></div>`).join('')||empty('◈','Здесь появятся твои пространства','Создай первый раздел для любой части своей жизни.','add-project','Создать пространство +')}</div><button class="primary-button v2-wide" data-action="add-project">＋ Создать пространство</button>`}
function renderProjectV2(){const p=v2Project(activeProjectId);if(!p){view='spaces';return renderSpacesV2()};const tasks=sortedTasks(data.tasks.filter(x=>x.projectId===p.id));const entries=sortedEntries(data.entries.filter(x=>x.projectId===p.id));const challenges=data.challenges.filter(x=>x.projectId===p.id);
 return `<button class="ghost-button" data-action="v2-go" data-view="spaces">‹ Все пространства</button>${v2Cover(p)}<p class="v2-description">${escape(p.description||'Все идеи, дела и маленькие победы в одном месте.')}</p><div class="v2-pills"><button class="soft-button" data-action="v2-style-space" data-id="${escape(p.id)}">✎ Оформление</button><button class="soft-button" data-action="edit-project" data-id="${escape(p.id)}">Изменить название</button></div><div class="section-header"><h2>✦ Заметки и идеи</h2><div class="v2-entry-type-actions"><button class="ghost-button" data-action="add-project-note" data-id="${escape(p.id)}">+ Заметка</button><button class="ghost-button" data-action="add-project-idea" data-id="${escape(p.id)}">+ Идея</button></div></div>${entries.length?entries.map(entryCard).join(''):empty('▤','Пока нет записей','Начни с идеи или референса.','add-project-note','Добавить запись +')}<div class="section-header"><h2>☑ Задачи</h2><button class="ghost-button" data-action="add-project-task" data-id="${escape(p.id)}">+ Задача</button></div>${tasks.length?tasks.map(taskCard).join(''):empty('☑','Задач нет','Можно придумать первый шаг.','add-project-task','Добавить +')}<div class="section-header"><h2>◷ Челленджи</h2><button class="ghost-button" data-action="v2-new-challenge" data-id="${escape(p.id)}">+ Челлендж</button></div>${challenges.length?challenges.map(v2ChallengeCard).join(''):`<p class="v2-empty-hint">У этого пространства пока нет челленджей.</p>`}`;
}
function v2ChallengeCard(c){const done=v2Days(c),pct=Math.round(done/Math.max(1,c.length)*100);return `<button class="v2-ch-card" data-action="v2-open-challenge" data-id="${escape(c.id)}"><div class="v2-ch-cover"><span>✦ ${escape(v2Project(c.projectId)?.title||'Личное')}</span></div><div class="v2-ch-inner"><strong>${escape(c.title)}</strong><div class="v2-muted">${escape(readableDate(c.start))} · ${c.length} дней</div><div class="v2-ch-stats"><span>${done} / ${c.length} дней</span><span>${pct}%</span></div><div class="v2-progress"><i style="width:${pct}%"></i></div></div></button>`}
function renderChallengesV2(){return `${pageHead('СЕРИИ И ПРИВЫЧКИ','Челленджи.','От 7 до 365 дней. Отмечай выполненное и оставляй заметки к каждому дню.')}${data.challenges.length?data.challenges.map(v2ChallengeCard).join(''):empty('◷','Челленджей пока нет','Запусти свою первую серию, всё в твоих руках.','v2-new-challenge','Создать челлендж +')}<button class="primary-button v2-wide" data-action="v2-new-challenge">＋ Создать челлендж</button>`}
function v2DateOffset(start,n){const [y,m,d]=start.split('-').map(Number);const date=new Date(y,m-1,d+n,12);return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
function renderChallengeV2(){const c=data.challenges.find(x=>x.id===challengeId);if(!c){view='challenges';return renderChallengesV2()};const done=v2Days(c),pct=Math.round(100*done/c.length),d=c.days?.[challengeDay]||{};const dayDate=v2DateOffset(c.start,challengeDay-1);
 return `<button class="ghost-button" data-action="v2-go" data-view="challenges">‹ Все челленджи</button><div class="v2-ch-cover v2-big-cover"><span>✦ ${escape(v2Project(c.projectId)?.title||'Личное')}</span><h2>${escape(c.title)}</h2></div><div class="v2-ch-stats"><span>${done} из ${c.length} дней</span><strong>${pct}%</strong></div><div class="v2-progress"><i style="width:${pct}%"></i></div><div class="v2-ch-calendar">${Array.from({length:c.length},(_,i)=>{let n=i+1,marked=!!c.days?.[n]?.done;return `<button data-action="v2-day" data-day="${n}" class="v2-day ${marked?'marked':''} ${challengeDay===n?'selected':''}" title="День ${n}">${marked?'✓':n}</button>`}).join('')}</div><div class="card v2-day-detail"><div class="v2-row"><div><div class="v2-muted">${escape(readableDate(dayDate))}</div><h3>День ${challengeDay}</h3></div><button class="soft-button" data-action="v2-toggle-day">${d.done?'✓ Выполнено':'○ Отметить день'}</button></div><label class="field"><span class="field-label">Заметка за день</span><textarea id="v2DayNote" placeholder="Что сделала? Как прошёл день? Какие идеи появились?" maxlength="6000">${escape(d.note||'')}</textarea></label><div class="v2-row"><button class="primary-button" data-action="v2-save-day-note">Сохранить заметку</button><button class="soft-button" data-action="v2-choose-image" data-target="day" data-id="${escape(c.id)}" data-day="${challengeDay}">📷 ${d.photo?'Сменить фото':'Добавить фото'}</button></div>${d.photo?`<img class="v2-day-photo" data-photo-id="${escape(d.photo.id)}" alt="Фото дня">`:''}</div><div class="v2-row"><button class="ghost-button" data-action="v2-edit-challenge" data-id="${escape(c.id)}">Изменить челлендж</button><button class="ghost-button v2-danger" data-action="v2-delete-challenge" data-id="${escape(c.id)}">Удалить</button></div>`;

   const row=await cloudRequest('/rest/v1/haos_vaults?select=revision',{method:'POST',headers:{Prefer:'return=representation'},json:{owner_id:cloudUser(),encrypted_vault:snapshot,revision:1},allowConflict:true});

   const row=await cloudRequest('/rest/v1/haos_vaults?owner_id=eq.'+encodeURIComponent(cloudUser())+'&revision=eq.'+initialRev+'&select=revision',{method:'PATCH',headers:{Prefer:'return=representation'},json:{encrypted_vault:snapshot,revision:initialRev+1,updated_at:new Date().toISOString()}});
   if(!row?.length)throw new Error('Облако изменилось на другом устройстве. Синхронизация остановлена, чтобы ничего не затереть.');
   next=Number(row[0].revision);

  localStorage.setItem('haos-cloud-last-sync-'+cloudUser(),new Date().toISOString());

 }catch(err){

function canonicalVaultForComparison(state){

  if(Array.isArray(value))return value.map(norm);
  if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).sort().map(k=>[k,norm(value[k])]));
  return value;
 };
 return JSON.stringify(norm({...Object.fromEntries(['tasks','entries','projects','challenges','events'].map(k=>[
  k,[...clean[k]].sort((a,b)=>String(a?.id||'').localeCompare(String(b?.id||'')))
 ])),appearance:clean.appearance}));
}

async function submitForm(event){
 event.preventDefault();if(photoDraftBusy){notify('Подожди, фото ещё обрабатываются');return}
 const form=event.target,kind=form.dataset.kind,id=form.dataset.id;
 const fields=Object.fromEntries(new FormData(form));const title=String(fields.title||'').trim(),body=String(fields.body||'').trim();
 const photos=photoDraft?[...photoDraft.existing,...photoDraft.added.map(x=>x.meta)]:[];
 if((kind!=='journal'&&!title)||(kind==='journal'&&!title&&!body&&!photos.length)){notify('Напиши хоть что-нибудь или добавь фото ✎');return}
 const collection=kind==='task'?'tasks':kind==='project'?'projects':'entries';
 const actualKind=(kind==='idea'||kind==='note')&&(fields.entryType==='idea'||fields.entryType==='note')?fields.entryType:kind;
 const existing=data[collection].find(x=>x.id===id);const timestamp=time();let record;
 if(kind==='task')record={id:existing?.id||uid(),title,detail:String(fields.detail||'').trim(),due:fields.due||'',priority:fields.priority==='high'?'high':'normal',projectId:fields.projectId||'',done:existing?.done||false,createdAt:existing?.createdAt||timestamp,updatedAt:timestamp};
 else if(kind==='project')record={id:existing?.id||uid(),title,description:String(fields.description||'').trim(),icon:existing?.icon||'◈',color:existing?.color||'#94304c',coverPhoto:existing?.coverPhoto||null,createdAt:existing?.createdAt||timestamp,updatedAt:timestamp};
 else record={id:existing?.id||uid(),type:actualKind,title:title||(kind==='journal'?'Запись за '+readableDate(formatToday()):'Без названия'),body,mood:kind==='journal'?fields.mood||'':'',projectId:fields.projectId||'',photos,createdAt:existing?.createdAt||timestamp,updatedAt:timestamp,...(actualKind==='idea'?{realized:existing?.realized||false}:{})};
 const button=form.querySelector('[type="submit"]');if(button){button.disabled=true;button.textContent='Сохраняю…'}
 const oldItems=data[collection];const addedIds=[];
 try{
   if(collection==='entries'&&photoDraft){for(const item of photoDraft.added){await storePhotoWithKey(item.meta.id,item.meta.mime,await item.blob.arrayBuffer(),activeKey);addedIds.push(item.meta.id)}}
   data[collection]=existing?oldItems.map(x=>x.id===id?record:x):[...oldItems,record];
   await save();markedAsChanged();
   if(existing?.photos?.length){for(const p of existing.photos){if(!photos.some(x=>x.id===p.id)){photoDBDelete(p.id).catch(console.warn);const url=photoURLCache.get(p.id);if(url){URL.revokeObjectURL(url);photoURLCache.delete(p.id)}}}}
   closeModal();render();notify(existing?'Изменения сохранены ♥':'Сохранено ♥');
 }catch(error){data[collection]=oldItems;for(const id of addedIds)await photoDBDelete(id).catch(console.warn);notify('Не удалось сохранить запись: '+error.message)}
 finally{if(button&&button.isConnected){button.disabled=false;button.textContent=existing?'Сохранить изменения':'Сохранить'}}
}
function toggleTask(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;t.updatedAt=time();save();render();notify(t.done?'Готово ✓':'Задача снова в списке')}
async function toggleIdeaStatus(id){const e=data.entries.find(x=>x.id===id&&x.type==='idea');if(!e)return;const prev=!!e.realized,prevUpdated=e.updatedAt;e.realized=!prev;e.updatedAt=time();try{await save();render();notify(e.realized?'Идея реализована ✓':'Идея снова не реализована')}catch(err){e.realized=prev;e.updatedAt=prevUpdated;render();notify('Не удалось сохранить: '+err.message)}}
async function convertNoteToIdea(id){const e=data.entries.find(x=>x.id===id&&x.type==='note');if(!e)return;const prevType=e.type,prevUpdated=e.updatedAt;e.type='idea';e.realized=false;e.updatedAt=time();try{await save();render();notify('Теперь это идея ✦')}catch(err){e.type=prevType;delete e.realized;e.updatedAt=prevUpdated;render();notify('Не удалось изменить тип: '+err.message)}}
async function removeRecord(kind,id){
 const collection=kind==='task'?'tasks':kind==='project'?'projects':'entries';
 if(!confirm(kind==='project'?'Удалить проект? Задачи и записи останутся, но без привязки к нему.':'Удалить эту запись без возможности отмены?'))return;
 const previous=JSON.parse(JSON.stringify(data));const target=data[collection].find(x=>x.id===id);
 data[collection]=data[collection].filter(x=>x.id!==id);
 if(kind==='project'){for(const x of [...data.tasks,...data.entries,...data.challenges,...data.events])if(x.projectId===id)x.projectId='';if(activeProjectId===id)view='spaces'}
 try{await save();if(kind==='project'&&target?.coverPhoto?.id)photoDBDelete(target.coverPhoto.id).catch(console.warn);if(kind!=='task'&&kind!=='project'&&target?.photos){for(const p of target.photos)photoDBDelete(p.id).catch(console.warn)}closeModal();render();notify('Удалено')}
 catch(err){data=previous;notify('Не получилось удалить: '+err.message)}
}

async function buildEncryptedBackup(){
 await persistQueue;
 const vault=JSON.parse(localStorage.getItem(VAULT_KEY));if(!vault)throw new Error('Сейф ещё не сохранён');
 const references=allPhotoMetas().map(p=>p.id);
 const photos=[];
 for(const id of references){const item=await photoDBGet(id);if(!item)throw new Error('Не найдена фотография '+id+'. Копия не создана, чтобы ничего не потерять.');
   photos.push({id,mime:'image/jpeg',iv:toBase64(new Uint8Array(item.iv)),ciphertext:toBase64(new Uint8Array(item.ciphertext)),version:1});
 }
 return {format:'haos-encrypted-backup-v3',exportedAt:time(),vault,photos};
}
async function downloadBackup(){
 try{
   const payload=await buildEncryptedBackup();
   const filename=`HAOS_MERGED_V2_${formatToday()}.haos`;
   const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
   const file=new File([blob],filename,{type:'application/json'});
   // Запрашиваем у пользователя системное сохранение: сайт не может без разрешения записывать в iCloud Drive.
   if(navigator.canShare?.({files:[file]})&&navigator.share){
     try{await navigator.share({files:[file],title:'Шифрованная копия ХАОС',text:'Выбери «Сохранить в Файлы», затем iCloud Drive.'});}
     catch(err){if(err.name==='AbortError')return;throw err;}
   }else{
     const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
     alert('Файл резервной копии сохранён в Загрузки. Перемести его в «Файлы» → iCloud Drive.');
   }
   localStorage.setItem(BACKUP_STATUS_KEY,time());render();notify('Копия подготовлена. Проверь, что файл есть в iCloud Drive ♥');
 }catch(err){console.error('Backup error',err);notify('Не удалось сделать копию: '+err.message)}
}
async function mergeBackup(file){
 if(!file)return;const created=[];
 try{
  if(file.size>350*1024*1024)throw new Error('Копия слишком большая');
  if(cloudSyncing||cloudBusy)throw new Error('Дождись завершения облачной синхронизации');
  if(cloudUser()&&!cloudEnabled)throw new Error('Сначала включи синхронизацию и сохрани свежую копию');
  await persistQueue;
  if(cloudEnabled){const row=await cloudGetRow();if(!row||Number(row.revision)!==cloudRev)throw new Error('В облаке другая версия. Нельзя объединять до решения конфликта.')}
  const raw=JSON.parse(await file.text());let restored,oldKey=null,sourcePhotos=[];
  if(raw?.format==='haos-encrypted-backup-v3'&&raw.vault&&Array.isArray(raw.photos)){
   const pass=prompt('Пароль старой резервной копии:');if(pass===null)return;const obj=await decryptState(raw.vault,pass);restored=obj.data;oldKey=obj.key;sourcePhotos=raw.photos;
  }else if(raw?.format==='haos-encrypted-backup-v2'&&raw.vault){const pass=prompt('Пароль старой копии:');if(pass===null)return;const obj=await decryptState(raw.vault,pass);restored=obj.data;oldKey=obj.key}
  else if(Array.isArray(raw.tasks)&&Array.isArray(raw.entries)&&Array.isArray(raw.projects)){if(!confirm('Незашифрованная копия. Перенести в защищённый сейф?'))return;restored=validateData(raw)}
  else throw new Error('Формат копии не распознан');
  const clean=validateData(restored),incoming={};
  for(const k of ['tasks','entries','projects','challenges','events']){
   const present=new Set(data[k].map(x=>x.id));incoming[k]=clean[k].filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&!present.has(x.id)).map(x=>structuredClone(x));
  }
  const incomingAppearance={};
  for(const k of ['logoPhoto','splashPhoto']){
    if(!data.appearance?.[k]&&clean.appearance?.[k]?.id)incomingAppearance[k]=structuredClone(clean.appearance[k]);
  }
  const n=Object.values(incoming).reduce((v,a)=>v+a.length,0);
  const nAppearance=Object.keys(incomingAppearance).length;
  if(!n&&!nAppearance)return notify('Все эти записи уже есть в сейфе ♥');
  if(!confirm(`Добавить ${incoming.entries.length} записей, ${incoming.tasks.length} задач, ${incoming.projects.length} пространств, ${incoming.challenges.length} челленджей, ${incoming.events.length} событий и ${nAppearance} персональных изображений? Текущие данные сохранятся.`))return;
  const incomingState={...incoming,appearance:incomingAppearance};
  const refs=allPhotoMetas(incomingState),byId=new Map(sourcePhotos.map(p=>[p.id,p])),mapping=new Map();
  for(const ref of refs){const item=byId.get(ref.id);if(!item||!oldKey)throw new Error('Отсутствует фото в старой копии: '+(ref.name||ref.id));const bytes=await decryptPhotoWithKey({version:1,iv:fromBase64(item.iv).buffer,ciphertext:fromBase64(item.ciphertext).buffer},oldKey);const newid=uid();await storePhotoWithKey(newid,'image/jpeg',bytes,activeKey);created.push(newid);mapping.set(ref.id,newid)}
  remapPhotoIds(incomingState,mapping);
  const previous=data;data={...data,...Object.fromEntries(Object.keys(incoming).map(k=>[k,[...data[k],...incoming[k]]])),appearance:{...data.appearance,...incomingAppearance}};
  try{await save()}catch(e){data=previous;throw e}
  created.length=0;closeModal();go('spaces');notify('Записи, задачи и фото объединены ♥');
 }catch(e){for(const id of created)await photoDBDelete(id).catch(()=>{});notify('Объединение не выполнено: '+e.message)}finally{document.getElementById('mergeFile').value=''}
}
async function importBackup(file){
 if(!file)return;const created=[];
 try{
  if(file.size>350*1024*1024)throw new Error('Файл слишком большой');
  const raw=JSON.parse(await file.text());let restored,oldKey=null,sourcePhotos=[];
  if(raw?.format==='haos-encrypted-backup-v3'&&raw.vault&&Array.isArray(raw.photos)){
   const pass=prompt('Пароль резервной копии:');if(pass===null)return;const obj=await decryptState(raw.vault,pass);restored=obj.data;oldKey=obj.key;sourcePhotos=raw.photos;
  }else if(raw?.format==='haos-encrypted-backup-v2'&&raw.vault){const pass=prompt('Пароль старой копии:');if(pass===null)return;const obj=await decryptState(raw.vault,pass);restored=obj.data;oldKey=obj.key}
  else if(Array.isArray(raw.tasks)&&Array.isArray(raw.entries)&&Array.isArray(raw.projects)){if(!confirm('Это НЕЗАШИФРОВАННАЯ копия. Продолжить?'))return;restored=validateData(raw)}
  else throw new Error('Неизвестный формат резервной копии');
  if(!confirm('ЗАМЕНИТЬ все текущие локальные записи и фото? Убедись, что копия сохранена отдельно.'))return;
  const clean=validateData(restored);const mapping=new Map(),byId=new Map(sourcePhotos.map(p=>[p.id,p]));
  for(const ref of allPhotoMetas(clean)){const old=byId.get(ref.id);if(!old||!oldKey)throw new Error('В копии отсутствует фото '+(ref.name||ref.id));const bytes=await decryptPhotoWithKey({version:1,iv:fromBase64(old.iv).buffer,ciphertext:fromBase64(old.ciphertext).buffer},oldKey);const id=uid();await storePhotoWithKey(id,'image/jpeg',bytes,activeKey);created.push(id);mapping.set(ref.id,id)}
  remapPhotoIds(clean,mapping);
  const previous=data,oldEnabled=cloudEnabled;
  cloudEnabled=false;if(cloudUser())localStorage.removeItem(cloudEnabledKey());
  try{data=clean;await save()}catch(e){data=previous;cloudEnabled=oldEnabled;throw e}
  created.length=0;for(const ref of allPhotoMetas(previous))photoDBDelete(ref.id).catch(()=>{});
  clearPhotoURLs();go('today');notify('Резервная копия восстановлена ♥');
 }catch(e){for(const id of created)await photoDBDelete(id).catch(()=>{});notify('Восстановление не выполнено: '+e.message)}finally{document.getElementById('importFile').value=''}
}
function handleAction(el){const action=el.dataset.action,id=el.dataset.id;if(!action)return;if(action.startsWith('v2-')){v2Action(el).catch(e=>notify('Не удалось сохранить: '+e.message));return;}switch(action){case 'add-idea':openForm('idea');break;case 'add-task':openForm('task',null,view==='project'?activeProjectId:null);break;case 'add-entry':chooseType();break;case 'add-project':openForm('project');break;case 'choose':openForm(el.dataset.type);break;case 'toggle-task':toggleTask(id);break;case 'toggle-idea-status':toggleIdeaStatus(id);break;case 'convert-note-to-idea':convertNoteToIdea(id);break;case 'edit-task':openForm('task',id);break;case 'edit-entry':{const e=data.entries.find(x=>x.id===id);if(e)openForm(e.type,id);break}case 'edit-project':openForm('project',id);break;case 'add-project-task':openForm('task',null,id);break;case 'add-project-note':openForm('note',null,id);break;case 'add-project-idea':openForm('idea',null,id);break;case 'task-filter':taskFilter=el.dataset.filter;render();break;case 'entry-filter':entryFilter=el.dataset.filter;render();break;case 'close-modal':closeModal();break;case 'open-project':activeProjectId=id;go('project');break;case 'projects':go('spaces');break;case 'more':go('more');break;case 'settings':go('settings');break;case 'pick-photos':modal.querySelector('#photoFilePicker')?.click();break;case 'remove-photo':removeDraftPhoto(el.dataset.photoId);break;case 'delete':removeRecord(el.dataset.kind,id);break;case 'lock-vault':lockVault();break;case 'cloud-register':cloudAccount('register');break;case 'cloud-login':cloudAccount('login');break;case 'cloud-enable':if(cloudEnabled)cloudPush();else cloudEnable();break;case 'cloud-restore':cloudRestore();break;case 'cloud-logout':cloudLogout();break;case 'export':downloadBackup();break;case 'import':$('#importFile').click();break;case 'merge':$('#mergeFile').click();break;case 'clear-all':if(confirm('Удалить ВСЁ ТОЛЬКО С ЭТОГО ТЕЛЕФОНА? Сначала сделай резервную копию.'))if(confirm('Облачная копия останется отдельно, а автоматическая синхронизация отключится. Продолжить?')){cloudEnabled=false;if(cloudUser())localStorage.removeItem(cloudEnabledKey());data=blank();save().then(()=>photoDBClear()).then(()=>{clearPhotoURLs();go('today');notify('Все данные удалены')}).catch(()=>notify('Не получилось полностью удалить данные'))}break;}}
document.addEventListener('click',event=>{if(event.target.closest('img.entry-photo')){event.preventDefault();event.stopPropagation();viewPhoto(event.target.dataset.photoId);return}if(event.target.id==='backdrop'){closeModal();return}const actionEl=event.target.closest('[data-action]');if(actionEl){handleAction(actionEl);return}const navEl=event.target.closest('[data-nav]');if(navEl){go(navEl.dataset.nav);return}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal.innerHTML)closeModal();if((event.key==='Enter'||event.key===' ')&&event.target.matches('[role="button"][data-action]')){event.preventDefault();handleAction(event.target)}});
document.addEventListener('submit',event=>{if(event.target.id==='recordForm')submitForm(event);else if(event.target.id==='v2ChallengeForm'||event.target.id==='v2EventForm')v2Submit(event).catch(e=>notify(e.message))});
document.addEventListener('change',event=>{if(event.target.id==='photoFilePicker')addPhotos(event.target.files);else if(event.target.id==='v2ImageFile')v2ImageChanged(event.target.files?.[0])});
$('#addQuick').addEventListener('click',chooseType);
$('#v2MoreToggle').addEventListener('click',()=>go('more'));
$('#searchToggle').addEventListener('click',()=>{const panel=$('#searchPanel');panel.classList.toggle('hidden');if(!panel.classList.contains('hidden'))$('#globalSearch').focus();else{query='';$('#globalSearch').value='';render()}});
$('#clearSearch').addEventListener('click',()=>{query='';$('#globalSearch').value='';$('#searchPanel').classList.add('hidden');render()});
$('#globalSearch').addEventListener('input',event=>{query=event.target.value;render()});
$('#importFile').addEventListener('change',event=>importBackup(event.target.files?.[0]));
$('#mergeFile').addEventListener('change',event=>mergeBackup(event.target.files?.[0]));
// PWA is installed from Safari; offline support is not yet enabled, so do not register a missing service worker.
initializeVault();
})();

function showTaskModal(id,preSpace){let t=id?data.tasks.find(x=>x.id===id):null;modal(`${modalHead(t?'Редактировать задачу':'Новая задача')}<form id="taskForm"><input type="hidden" name="id" value="${esc(id||'')}"><div class="field"><label>Задача</label><input class="input" name="title" required maxlength="110" placeholder="Что нужно сделать?" value="${esc(t?.title||'')}"></div><div class="field"><label>Раздел</label><select class="input" name="space">${spaceOptions(t?.space||preSpace||selectedSpace)}</select></div><div class="field"><label>Дата</label><input class="input" type="date" name="due" value="${t?.due||now}"></div><button class="button wide" type="button" data-action="save-form">Сохранить задачу</button>${t?`<button class="button secondary wide" type="button" data-action="delete-task" data-id="${t.id}" style="margin-top:10px">Удалить задачу</button>`:''}</form>`);}
function showChallengeModal(id,preSpace){let c=id?data.challenges.find(x=>x.id===id):null;modal(`${modalHead(c?'Настроить челлендж':'Создать челлендж')}<form id="challengeForm"><input type="hidden" name="id" value="${esc(id||'')}"><div class="field"><label>Название</label><input class="input" name="title" required maxlength="110" placeholder="Например: 30 дней публикаций" value="${esc(c?.title||'')}"></div><div class="field"><label>Пространство</label><select class="input" name="space">${spaceOptions(c?.space||preSpace||selectedSpace)}</select></div><div class="two"><div class="field"><label>Дата начала</label><input class="input" type="date" name="start" value="${c?.start||now}" required></div><div class="field"><label>Дней (7–365)</label><input class="input" type="number" min="7" max="365" name="length" value="${c?.length||30}" required></div></div><p class="small muted" style="margin:-2px 0 14px">Каждый день можно будет отметить и дополнить заметкой.</p><button class="button wide" type="button" data-action="save-form">${c?'Сохранить':'Создать челлендж'}</button>${c?`<button type="button" class="button secondary wide" data-action="delete-challenge" data-id="${c.id}" style="margin-top:10px">Удалить челлендж</button>`:''}</form>`);}
function showEventModal(id,date){let e=id?data.events.find(x=>x.id===id):null;modal(`${modalHead(e?'Изменить событие':'Новое событие')}<form id="eventForm"><input type="hidden" name="id" value="${esc(id||'')}"><div class="field"><label>Название</label><input class="input" name="title" maxlength="110" required placeholder="Что запланировано?" value="${esc(e?.title||'')}"></div><div class="two"><div class="field"><label>Дата</label><input type="date" name="date" class="input" value="${e?.date||date||calendarDay}" required></div><div class="field"><label>Время</label><input type="time" name="time" class="input" value="${e?.time||'12:00'}" required></div></div><div class="field"><label>Пространство</label><select class="input" name="space">${spaceOptions(e?.space||selectedSpace)}</select></div><div class="field"><label>Пометка</label><input name="notes" class="input" maxlength="150" value="${esc(e?.notes||'')}" placeholder="Необязательно"></div><button class="button wide" type="button" data-action="save-form">Сохранить событие</button>${e?`<button type="button" class="button secondary wide" data-action="delete-event" data-id="${e.id}" style="margin-top:10px">Удалить событие</button>`:''}</form>`);}
function quickModal(preSpace){modal(`${modalHead('Что создаём?')}<p class="muted small" style="margin:-5px 0 18px">Начни с чего-то одного.</p><div style="display:grid;gap:10px">${[['modal-note','note','Запись или идея'],['modal-task','checksquare','Задача'],['modal-challenge','flag','Челлендж'],['modal-space','layers','Пространство'],['modal-event','calendar','Событие в календаре']].map(([act,icon,label])=>`<button class="space-card" type="button" data-action="${act}" ${preSpace?`data-space="${preSpace}"`:''}><span class="i-box" style="color:#e99dad">${ic(icon)}</span><strong style="flex:1;text-align:left">${label}</strong>${ic('chevron')}</button>`).join('')}</div>`);}
function action(el){const act=el.dataset.action,id=el.dataset.id;switch(act){case 'nav':close();openView(el.dataset.view);break;case 'open-space':openSpace(id);break;case 'open-challenge':openChallenge(id);break;case 'space-tab':spaceTab=el.dataset.tab;render();break;case 'quick':quickModal(el.dataset.space);break;case 'close':close();break;case 'about':openView('about');break;case 'modal-space':showSpaceModal(id);break;case 'modal-note':showNoteModal(id,el.dataset.space);break;case 'modal-task':showTaskModal(id,el.dataset.space);break;case 'modal-challenge':showChallengeModal(id,el.dataset.space);break;case 'modal-event':showEventModal(id,el.dataset.date);break;
case 'save-form':{const form=el.closest('form');if(form)submit(form);break}
case 'pick-icon':curIcon=el.dataset.icon;document.querySelectorAll('.iconopt').forEach(n=>n.classList.toggle('sel',n.dataset.icon===curIcon));break;
case 'pick-color':curColor=el.dataset.color;document.querySelectorAll('.coloropt').forEach(n=>n.classList.toggle('sel',n.dataset.color===curColor));break;
case 'toggle-task':{const t=data.tasks.find(x=>x.id===id);if(t)t.done=!t.done;render();break}
case 'toggle-day':{const c=data.challenges.find(x=>x.id===selectedChallenge),d=+el.dataset.day;if(!c)break;c.done=c.done.includes(d)?c.done.filter(x=>x!==d):[...c.done,d].sort((a,b)=>a-b);render();break}
case 'challenge-day':challengeDay=+el.dataset.day;render();break;
case 'save-challenge-note':{const c=data.challenges.find(x=>x.id===selectedChallenge);if(c){let note=document.getElementById('challengeNote').value.trim();if(note)c.days[challengeDay]=note;else delete c.days[challengeDay];toast('Заметка дня сохранена ♥');render()}break}
case 'calendar-day':calendarDay=el.dataset.date;render();break;
case 'month':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+Number(el.dataset.offset),1);calendarDay=iso(calendarMonth);render();break;
case 'save-calendar-note':{const val=document.getElementById('calendarNote').value.trim();if(val)data.diary[calendarDay]=val;else delete data.diary[calendarDay];toast('Заметка дня сохранена ♥');render();break}
case 'toggle-event':{let e=data.events.find(x=>x.id===id);if(e)e.done=!e.done;render();break}
case 'delete-note':if(confirm('Удалить эту запись из демо?')){data.notes=data.notes.filter(x=>x.id!==id);close();render();toast('Запись удалена из демо')}break;
case 'delete-task':if(confirm('Удалить задачу из демо?')){data.tasks=data.tasks.filter(x=>x.id!==id);close();render();toast('Задача удалена')}break;
case 'delete-event':if(confirm('Удалить событие из демо?')){data.events=data.events.filter(x=>x.id!==id);close();render();toast('Событие удалено')}break;
case 'delete-challenge':if(confirm('Удалить челлендж из демо?')){data.challenges=data.challenges.filter(x=>x.id!==id);close();openView('challenges');toast('Челлендж удалён')}break;
case 'delete-space':if(confirm('Удалить раздел и содержимое только в этом демо?')){data.spaces=data.spaces.filter(x=>x.id!==id);data.notes=data.notes.filter(x=>x.space!==id);data.tasks=data.tasks.filter(x=>x.space!==id);data.challenges=data.challenges.filter(x=>x.space!==id);data.events=data.events.filter(x=>x.space!==id);close();openView('spaces');toast('Раздел удалён из демо')}break;
case 'reset':if(confirm('Сбросить демонстрационные данные?')){data=seed();close();openView('home');toast('Демо перезапущено')}break;}}
function submit(form){const d=Object.fromEntries(new FormData(form));if(form.getAttribute('id')==='spaceForm'){let name=String(d.name||'').trim();if(!name)return;let s=d.id?space(d.id):null;if(s){s.name=name;s.desc=String(d.desc||'').trim();s.icon=curIcon;s.color=curColor;s.cover='custom';}else{let id=uid();data.spaces.push({id,name,desc:String(d.desc||'').trim(),icon:curIcon,color:curColor,cover:'custom'});selectedSpace=id;}close();openSpace(selectedSpace);toast('Пространство сохранено ♥')}
else if(form.getAttribute('id')==='noteForm'){let title=String(d.title||'').trim();if(!title)return;let n=data.notes.find(x=>x.id===d.id);if(n){Object.assign(n,{title,space:d.space,kind:d.kind,body:String(d.body||'')})}else data.notes.push({id:uid(),title,body:String(d.body||''),kind:d.kind,space:d.space,date:now});close();render();toast('Запись сохранена ♥')}
else if(form.getAttribute('id')==='taskForm'){let title=String(d.title||'').trim();if(!title)return;let t=data.tasks.find(x=>x.id===d.id);if(t){Object.assign(t,{title,space:d.space,due:d.due})}else data.tasks.push({id:uid(),title,space:d.space,due:d.due,done:false});close();render();toast('Задача сохранена ♥')}
else if(form.getAttribute('id')==='challengeForm'){let title=String(d.title||'').trim(),length=Math.max(7,Math.min(365,parseInt(d.length)||30));if(!title)return;let c=data.challenges.find(x=>x.id===d.id);if(c){c.title=title;c.space=d.space;c.start=d.start;c.length=length;c.done=c.done.filter(x=>x<=length);c.days=Object.fromEntries(Object.entries(c.days).filter(([n])=>Number(n)<=length));}else{let id=uid();data.challenges.push({id,title,space:d.space,start:d.start,length,done:[],days:{}});selectedChallenge=id}close();openChallenge(selectedChallenge);toast('Челлендж готов ♥')}
else if(form.getAttribute('id')==='eventForm'){let title=String(d.title||'').trim();if(!title)return;let e=data.events.find(x=>x.id===d.id);if(e){Object.assign(e,{title,date:d.date,time:d.time,space:d.space,notes:d.notes})}else data.events.push({id:uid(),title,date:d.date,time:d.time,space:d.space,notes:String(d.notes||''),done:false});calendarDay=d.date;calendarMonth=new Date(parseDate(d.date).getFullYear(),parseDate(d.date).getMonth(),1);close();openView('calendar');toast('Событие сохранено ♥')}
}
document.addEventListener('click',e=>{if(e.target.id==='modalBackdrop'){close();return;}const el=e.target.closest('[data-action]');if(el){e.preventDefault();action(el)}});
document.addEventListener('submit',e=>{e.preventDefault();if(['spaceForm','noteForm','taskForm','challengeForm','eventForm'].includes(e.target.getAttribute('id')))submit(e.target)},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
render();
})();
</script></body></html>
